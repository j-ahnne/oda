<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ODA 자격시험 실전 문제은행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@700&display=swap">
<style>
/* Layout: single centered column (max 720px); header card → tile grid (home) or one question card (quiz). Exam-paper feel: ruled dividers, deep harbor-blue accent. */
:root{
  --bg:#f3f4f0; --card:#ffffff; --fg:#1c2230; --muted:#5f6878; --line:#d9dcd5;
  --accent:#1f5f7a; --accent-fg:#ffffff; --accent-soft:#e3eef3;
  --ok:#2d7d46; --ok-soft:#e4f3e8; --bad:#b4442c; --bad-soft:#f8e7e2; --warn:#9a6a12;
  --display:"Gowun Batang",serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a1f; --card:#20252d; --fg:#e8eaee; --muted:#9aa3b2; --line:#343b47;
  --accent:#6fb4d1; --accent-fg:#0f1a21; --accent-soft:#1d2f3a;
  --ok:#6cc98a; --ok-soft:#1d3326; --bad:#f08b72; --bad-soft:#3a221c; --warn:#e0b05a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a1f; --card:#20252d; --fg:#e8eaee; --muted:#9aa3b2; --line:#343b47;
  --accent:#6fb4d1; --accent-fg:#0f1a21; --accent-soft:#1d2f3a;
  --ok:#6cc98a; --ok-soft:#1d3326; --bad:#f08b72; --bad-soft:#3a221c; --warn:#e0b05a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display)}
h1{font-size:1.5rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top p{margin:6px 0 0;color:var(--muted);font-size:.92rem}
button{font-family:inherit;font-size:.95rem;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
.subject{display:grid;gap:10px}
.subject h2{font-size:1.05rem;display:flex;align-items:baseline;gap:8px}
.subject h2 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.82rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{text-align:left;display:grid;gap:4px;padding:12px 14px}
.tile b{font-weight:600}
.tile span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile:hover{border-color:var(--accent)}
.exam{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.exam .desc{color:var(--muted);font-size:.9rem;min-width:0;flex:1 1 260px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{border-top:2px solid var(--line);padding-top:6px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
/* quiz */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.qbar .timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.qbar .timer.low{color:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qnum{font-family:var(--display);font-size:1.6rem;color:var(--accent);line-height:1}
.qtext{font-size:1.05rem;font-weight:500;margin:10px 0 16px;text-wrap:pretty}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:11px 14px;line-height:1.45}
.opt .n{font-family:var(--display);color:var(--muted);font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:.85}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)} .opt.correct .n{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .n{color:var(--bad)}
.exp{margin-top:14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.93rem}
.exp.bad{border-left-color:var(--bad)} .exp.good{border-left-color:var(--ok)}
.exp b{display:block;margin-bottom:4px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
/* result */
.score{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.pass{font-weight:700} .pass.ok{color:var(--ok)} .pass.no{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:.8rem}
td.r,th.r{text-align:right}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.review{display:grid;gap:10px}
.review .item{border-top:1px solid var(--line);padding-top:10px;font-size:.92rem}
.review .item .q{font-weight:500}
.review .item .a{color:var(--muted);margin-top:4px}
.review .item .a b{color:var(--ok);font-weight:600}
.chara{display:block;max-width:100%;height:auto;object-fit:contain;flex:0 0 auto}
.hero{align-items:center}
.hero>div:first-child{flex:1 1 280px;min-width:0}
.hero .chara{width:132px;height:132px;margin-left:auto}
.exp{display:flex;gap:12px;align-items:flex-start}
.exp .chara{width:64px;height:64px;margin-top:-2px}
.exp>div{min-width:0;flex:1}
.review .item .a{display:flex;gap:10px;align-items:flex-start}
.review .item .a .chara{width:44px;height:44px}
.review .item .a>div{min-width:0;flex:1}
@media (max-width:520px){.hero .chara{width:96px;height:96px}.exp .chara{width:48px;height:48px}}
.subfoot{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.subfoot button small{color:var(--muted);font-size:.8rem;margin-left:4px}
.credit{text-align:center;color:var(--muted);font-size:.82rem;padding-top:8px}
.credit a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.credit a:hover{border-bottom-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
// ===== 문제 데이터 =====
// 각 문항: q 질문, o 보기 4개, a 정답 인덱스(0~3), e 해설
const PARTS = [
 {id:'p1-1',subj:1,name:'국제개발협력과 ODA의 이해',qs:[
  {q:'OECD DAC의 ODA 정의에 해당하지 않는 요건은?',o:['공적 기관이 제공할 것','개도국의 경제개발·복지 증진이 주목적일 것','수원국 기업이 조달을 담당할 것','양허적(concessional) 조건일 것'],a:2,e:'ODA 4요건은 공적 기관·개발 목적·양허성·DAC 수원국 목록(또는 다자기구) 대상이다. 조달처는 ODA 정의와 무관하며, 구속성 여부를 가르는 별개 기준이다.'},
  {q:'2018년부터 적용된 증여등가액 방식에서 최빈국(LDC) 대상 차관이 ODA로 인정되려면 증여율이 최소 몇 % 이상이어야 하는가?',o:['10%','15%','25%','45%'],a:3,e:'LDC·기타 저소득국 45%(할인율 9%), 하위중소득국 15%(7%), 상위중소득국 10%(6%). 25%는 2017년까지의 구방식(할인율 10%) 기준이다.'},
  {q:'공여국이 사용처(국가·분야)를 지정하여 국제기구에 제공한 자금의 통계 분류는?',o:['다자 ODA','다자성 양자(multi-bi) — 양자 ODA','기타공적자금(OOF)','민간자금흐름(PF)'],a:1,e:'다자 ODA는 기구가 자율 집행하는 핵심 분담·출자금만 해당한다. 사용처가 지정되면 다자성 양자로 보아 양자 ODA에 포함된다.'},
  {q:'ODA에 포함될 수 있는 것은?',o:['군사 장비 제공','개도국 공무원 초청 연수','수원국 내 종교 포교 활동 지원','핵무기 관련 기술 이전'],a:1,e:'기술협력(연수·전문가·봉사단)은 무상원조의 대표 유형이다. 군사원조, 종교·문화 선전, 핵의 비평화적 이용은 ODA 불인정 항목이다.'},
  {q:'UN이 지정하는 최빈국(LDC) 판정 3기준이 아닌 것은?',o:['1인당 GNI','인적자산지수(HAI)','경제·환경 취약성지수(EVI)','부패인식지수(CPI)'],a:3,e:'LDC는 UN 개발정책위원회(CDP)가 1인당 GNI·HAI·EVI로 3년마다 심사한다. CPI는 국제투명성기구의 부패 지표다.'},
  {q:'세계은행 국제빈곤선이 2022년 9월 조정된 값(2017 PPP 기준)은?',o:['$1.25','$1.90','$2.15','$3.00'],a:2,e:'$1.25(2005 PPP) → $1.90(2015년, 2011 PPP) → $2.15(2022년, 2017 PPP) → $3.00(2025년 6월, 2021 PPP). 교재(2023 개정판) 기준 최신값은 $2.15다.'},
  {q:'UNDP·OPHI의 다차원빈곤지수(MPI)가 측정하는 3차원은?',o:['소득·자산·소비','건강·교육·생활수준','기대수명·교육·소득','영양·위생·주거'],a:1,e:'MPI(2010)는 건강·교육·생활수준 3차원 10개 지표를 1/3씩 가중한다. 기대수명·교육·1인당 GNI 3차원은 HDI(1990)다.'},
  {q:'『세계의 절반 구하기』에서 "계획가(planner)"의 하향식 원조를 비판하고 "탐색가(searcher)"를 옹호한 학자는?',o:['제프리 삭스','윌리엄 이스털리','담비사 모요','아마르티아 센'],a:1,e:'이스털리(2006)는 삭스의 빅푸시론(『빈곤의 종말』 2005)에 맞서 원조 계획주의를 비판했다. 모요(『죽은 원조』 2009)는 아프리카 원조 의존을 비판했고, 센은 역량접근을 제시했다.'},
  {q:'ODA/GNI 0.7% 목표의 출처로 옳게 짝지어진 것은?',o:['1969 피어슨 보고서 권고 → 1970 UN 총회 결의 2626','1961 UN 제1차 개발 10년 → 1964 UNCTAD','1987 브룬트란트 보고서 → 1992 리우회의','2000 새천년선언 → 2002 몬테레이 컨센서스'],a:0,e:'피어슨 위원회가 1969년 『Partners in Development』에서 ODA/GNP 0.7%를 권고했고, UN 총회가 1970년 결의 2626으로 공식 채택했다.'},
  {q:'1994년 UNDP 인간개발보고서가 제시한 개념으로 "공포로부터의 자유·결핍으로부터의 자유"를 핵심으로 하는 것은?',o:['인간안보','인간개발','기본욕구','지속가능발전'],a:0,e:'인간안보(human security)는 경제·식량·보건·환경·개인·공동체·정치 7개 영역으로 구성된다. 인간개발은 1990 HDR, 기본욕구는 1976 ILO, 지속가능발전은 1987 WCED 개념이다.'},
  {q:'로스토(W. Rostow)의 경제성장 5단계에 속하지 않는 것은?',o:['전통사회','도약(take-off)','구조조정','고도대중소비'],a:2,e:'로스토(1960)의 5단계는 전통사회→도약준비→도약→성숙→고도대중소비다. 구조조정(SAP)은 1980년대 IMF·세계은행 정책이다.'},
  {q:'2023년 DAC 회원국 ODA 총액이 사상 최대(약 2,237억 달러)를 기록한 주요 요인이 아닌 것은?',o:['우크라이나 지원 급증','공여국 내 난민 수용 비용 계상','코로나19 백신·보건 지원','사하라 이남 아프리카 양자 ODA 급증'],a:3,e:'2022~23년 증가는 우크라이나·공여국 내 난민비용·코로나 대응이 견인했고, 오히려 아프리카·LDC 대상 ODA는 정체 또는 감소해 비판을 받았다.'},
 ]},
 {id:'p1-2',subj:1,name:'국제개발협력의 역사',qs:[
  {q:'현대 ODA의 기원으로 평가되는 마셜플랜의 집행기구로 1948년 설립되어 1961년 OECD로 개편된 것은?',o:['OEEC','UNRRA','DAG','IBRD'],a:0,e:'OEEC(유럽경제협력기구)는 마셜플랜 집행을 위해 설립됐고 1961년 OECD로 개편됐다. DAG는 1960년 발족해 1961년 DAC가 됐다.'},
  {q:'개도국 기술원조를 미국 외교정책의 네 번째 축으로 처음 천명한 1949년 연설은?',o:['트루먼 독트린','포인트 포(Point Four)','마셜플랜 연설','뉴프런티어'],a:1,e:'트루먼 대통령의 1949년 취임연설 네 번째 항목(Point Four)이 개도국 기술원조 계획이다. 트루먼 독트린(1947)은 그리스·터키 반공 지원이다.'},
  {q:'원조효과성 고위급포럼(HLF)의 개최 순서로 옳은 것은?',o:['파리 → 로마 → 아크라 → 부산','로마 → 파리 → 아크라 → 부산','로마 → 아크라 → 파리 → 부산','파리 → 아크라 → 로마 → 부산'],a:1,e:'HLF-1 로마(2003, 조화) → HLF-2 파리(2005, 파리선언) → HLF-3 아크라(2008, AAA) → HLF-4 부산(2011, 개발효과성·GPEDC).'},
  {q:'파리선언(2005) 5원칙에 해당하지 않는 것은?',o:['주인의식(Ownership)','일치(Alignment)','투명성(Transparency)','상호책무성(Mutual Accountability)'],a:2,e:'파리선언 5원칙은 주인의식·일치·조화·성과관리·상호책무성이다. "투명성과 상호책무성"은 2011 부산 파트너십 4원칙에 등장한다.'},
  {q:'2008 아크라 행동계획(AAA)의 성과로 옳은 것은?',o:['SDGs 수립 합의','시민사회단체(CSO)를 독립적 개발주체로 공식 인정','GPEDC 출범','ODA/GNI 0.7% 목표 채택'],a:1,e:'아크라에서 CSO가 독립 개발주체로 인정되어 2010 이스탄불 원칙으로 이어졌다. SDGs 합의는 2012 리우+20, GPEDC는 부산(2011) 결과로 2012 출범, 0.7%는 1970이다.'},
  {q:'부산 세계개발원조총회(2011)의 핵심 전환으로 옳은 것은?',o:['원조효과성 → 개발효과성','MDGs → SDGs','구속성 → 비구속성 원조','양자 → 다자 원조'],a:0,e:'부산총회는 원조(aid)를 넘어 개발 전반의 효과성을 다루는 개발효과성으로 담론을 전환하고, 민간·신흥공여국을 포괄하는 GPEDC를 출범시켰다.'},
  {q:'"미래세대의 필요 충족 능력을 훼손하지 않으면서 현세대의 필요를 충족하는 발전"으로 지속가능발전을 정의한 문서는?',o:['1972 스톡홀름 선언','1987 브룬트란트 보고서(Our Common Future)','1992 의제21','2002 요하네스버그 선언'],a:1,e:'WCED(브룬트란트 위원회) 1987 보고서의 정의다. 1992 리우회의는 이를 의제21과 기후변화협약으로 구체화했다.'},
  {q:'MDGs의 모태가 된 1996년 OECD DAC 문서와 그 안의 목표는?',o:['『21세기 구상』 — 국제개발목표(IDGs)','『피어슨 보고서』 — 0.7% 목표','『파리선언』 — 5원칙','『몬테레이 컨센서스』 — 개발재원'],a:0,e:'DAC의 『Shaping the 21st Century』(1996)가 7개 국제개발목표(IDGs)를 제시했고, 2000 새천년선언과 결합해 MDGs가 됐다.'},
  {q:'UN 개발재원총회(FfD)의 개최지·연도 짝으로 옳지 않은 것은?',o:['1차 몬테레이 2002','2차 도하 2008','3차 아디스아바바 2015','4차 나이로비 2016'],a:3,e:'4차 개발재원총회는 2025년 세비야(스페인)다. 2016 나이로비는 GPEDC 제2차 고위급회의다.'},
  {q:'1999년 도입되어 HIPC 채무감면의 조건이 된 수원국 주도 전략문서는?',o:['CAS','PRSP','UNDAF','NDC'],a:1,e:'빈곤감소전략보고서(PRSP)는 세계은행·IMF가 1999년 도입했다. CAS는 세계은행 국별지원전략, UNDAF는 UN 개발지원프레임워크, NDC는 파리협정 국가결정기여다.'},
  {q:'2015년에 채택된 3대 국제 합의로 묶인 것은?',o:['AAAA · SDGs · 파리기후협정','MDGs · 교토의정서 · 몬테레이','파리선언 · 부산파트너십 · 센다이','의제21 · UNFCCC · 생물다양성협약'],a:0,e:'2015년 7월 아디스아바바 행동의제(AAAA), 9월 SDGs, 12월 파리협정이 연이어 채택됐다. 센다이 재난위험경감 프레임워크도 2015년 3월이다.'},
 ]},
 {id:'p1-3',subj:1,name:'SDGs와 MDGs',qs:[
  {q:'SDGs의 구조로 옳은 것은?',o:['8목표 21세부목표 60지표','17목표 169세부목표 231지표','17목표 169세부목표 100지표','15목표 150세부목표 200지표'],a:1,e:'SDGs는 17목표·169세부목표·231개(중복 포함 248개) 지표다. 8·21·60은 MDGs 구조다.'},
  {q:'SDGs의 5P에 해당하지 않는 것은?',o:['People','Planet','Profit','Partnership'],a:2,e:'5P는 People·Planet·Prosperity·Peace·Partnership이다. Profit은 기업 CSR의 3P(People·Planet·Profit)에서 쓰인다.'},
  {q:'SDGs 채택에 관한 설명으로 옳지 않은 것은?',o:['2015년 9월 UN 지속가능발전정상회의에서 193개국 만장일치 채택','결의 70/1 『Transforming our World』','공개작업반(OWG)을 통한 참여적 수립','개도국에만 적용되는 목표'],a:3,e:'SDGs는 선진국을 포함한 모든 국가에 적용되는 보편성(universality)이 핵심 특징이다. 개도국 중심은 MDGs의 한계였다.'},
  {q:'SDGs 이행 점검을 위한 고위급정치포럼(HLPF)을 주관하는 UN 기관은?',o:['안전보장이사회','경제사회이사회(ECOSOC)','UNDP','UNCTAD'],a:1,e:'HLPF는 ECOSOC 주관으로 매년 7월 열리며 4년마다 총회급(SDG Summit, 2019·2023)으로 개최된다. 국가는 자발적 국별리뷰(VNR)를 제출한다.'},
  {q:'SDG 번호와 주제가 잘못 짝지어진 것은?',o:['SDG 4 — 양질의 교육','SDG 13 — 기후행동','SDG 16 — 평화·정의·제도','SDG 9 — 불평등 감소'],a:3,e:'SDG 9는 산업·혁신·인프라, 불평등 감소는 SDG 10이다. 빈출 번호: 1빈곤 2기아 3보건 5성평등 6물 7에너지 8일자리 11도시 12소비 14해양 15육상 17파트너십.'},
  {q:'MDGs 8개 목표에 포함되지 않았던 것은?',o:['보편적 초등교육 달성','HIV/AIDS·말라리아 등 질병 퇴치','불평등 감소','개발을 위한 글로벌 파트너십'],a:2,e:'MDGs는 빈곤·교육·성평등·아동사망·모성보건·질병·환경·파트너십 8개다. 불평등·평화·제도·에너지는 SDGs에서 새로 들어온 영역이다.'},
  {q:'SDGs의 핵심 원칙 "Leave No One Behind"와 가장 관련 깊은 것은?',o:['가장 뒤처진 집단에 먼저 도달','경제성장 우선','공여국 이익 보장','선진국 면제'],a:0,e:'LNOB는 가장 소외된 사람에게 먼저 도달(reach the furthest behind first)하는 포용성 원칙으로, 인권기반접근과 직결된다.'},
  {q:'2015 아디스아바바 행동의제(AAAA)가 다룬 개발재원에 해당하지 않는 것은?',o:['국내 공공재원(세수)','민간 재원·송금','무역','군사비 지출'],a:3,e:'AAAA는 국내공공·국내외민간·국제공공(ODA)·무역·부채·과학기술·데이터 등 7개 행동영역을 다뤘다. 혼합금융·불법자금흐름 차단·조세협력이 핵심 의제였다.'},
  {q:'한국의 K-SDGs에 관한 설명으로 옳은 것은?',o:['2015년 수립, 8개 목표','2018년 수립, 17개 목표·122개 세부목표','2021년 수립, 10개 목표','2010년 수립, 169개 세부목표'],a:1,e:'K-SDGs는 2018년 수립(17목표·122세부목표·214지표) 후 2021년 개정됐다. 지속가능발전위원회는 2022년 환경부에서 국무총리 소속으로 격상됐다.'},
  {q:'MDGs의 한계로 지적된 것이 아닌 것은?',o:['개도국 중심이라 선진국의 책임 불분명','상의하달식 수립 과정','사회개발에 치우쳐 환경·거버넌스 취약','목표가 너무 많아 측정 불가'],a:3,e:'MDGs는 오히려 8개 목표로 단순·측정 가능해 성과가 컸다는 평가를 받는다. 한계는 보편성 부재, 수립의 비참여성, 불평등·환경·제도 영역 누락이다.'},
 ]},
 {id:'p1-4',subj:1,name:'국제개발협력의 다양한 주체',qs:[
  {q:'OECD DAC에 관한 설명으로 옳지 않은 것은?',o:['1961년 설립, 파리 소재','2024년 기준 32개 회원(31개국+EU)','한국은 2010년 1월 1일 가입','아시아 회원국은 한국이 유일'],a:3,e:'일본은 1961년 창설 회원이다. 아시아 회원은 일본·한국 2개국이며, 최근 가입국은 리투아니아(2022)·에스토니아(2023)다.'},
  {q:'DAC의 동료검토(peer review)에 관한 설명으로 옳은 것은?',o:['매년 모든 회원국 대상 실시','한국은 2012·2017·2024년 검토를 받음','수원국이 공여국을 평가','법적 구속력 있는 제재 수반'],a:1,e:'동료검토는 4~5년 주기로 다른 회원국 2개국이 검토하며 권고 형태로 법적 구속력은 없다. 한국은 2012, 2017, 2024년 세 차례 받았다.'},
  {q:'세계은행그룹에서 최빈국에 무이자·무상에 가까운 양허성 자금을 제공하는 기구는?',o:['IBRD','IDA','IFC','MIGA'],a:1,e:'IDA(1960)는 최빈국 양허성 창구, IBRD(1944)는 중소득국 차관, IFC(1956)는 민간투자, MIGA(1988)는 투자보증, ICSID(1966)는 투자분쟁 중재다.'},
  {q:'지역개발은행과 본부 도시 짝이 옳지 않은 것은?',o:['ADB — 마닐라','AIIB — 베이징','AfDB — 나이로비','EBRD — 런던'],a:2,e:'AfDB 본부는 코트디부아르 아비장이다. IDB는 워싱턴, NDB(BRICS)는 상하이다.'},
  {q:'2010년 UNIFEM·DAW·OSAGI·INSTRAW 4개 기구를 통합해 설립된 UN 기구는?',o:['UNFPA','UN Women','UNICEF','UNDP'],a:1,e:'UN Women(2010)은 성평등·여성역량 전담기구다. UNFPA는 인구·성생식보건, UNICEF는 아동, UNDP는 개발 총괄·HDR 발간이다.'},
  {q:'2020년 노벨평화상을 수상한 UN 기구는?',o:['UNHCR','WFP','UNICEF','WHO'],a:1,e:'세계식량계획(WFP, 1961 로마)이 기아 퇴치 공로로 2020년 수상했다. UNHCR은 1954·1981, UNICEF는 1965, IPCC는 2007 수상이다.'},
  {q:'시민사회단체의 개발효과성 8원칙을 담은 2010년 문서는?',o:['이스탄불 원칙','나이로비 선언','마라케시 선언','카이로 행동계획'],a:0,e:'아크라(2008)에서 CSO가 개발주체로 인정된 후 2010년 이스탄불 CSO 개발효과성 원칙 8개(인권·성평등·주인의식·투명성 등)가 채택됐다.'},
  {q:'남남협력(South-South Cooperation)의 규범적 출발점으로 1978년 채택된 문서는?',o:['반둥 10원칙','부에노스아이레스 행동계획(BAPA)','아루샤 선언','마닐라 선언'],a:1,e:'BAPA(1978)는 개도국 간 기술협력(TCDC) 행동계획이며 2019년 BAPA+40 회의가 열렸다. 반둥회의(1955)는 정치적 출발점이다. 전통공여국+신흥공여국+수원국은 삼각협력이다.'},
  {q:'DAC 가입을 위한 ODA 규모 요건으로 옳은 것은?',o:['ODA/GNI 0.7% 이상','ODA/GNI 0.2% 또는 연 1억 달러 이상','연 10억 달러 이상','ODA/GNI 0.5% 이상'],a:1,e:'DAC 가입 요건은 적절한 전략·정책·제도, ODA 규모(GNI 0.2% 또는 1억 달러), 모니터링·평가체계 3가지다.'},
  {q:'한국의 개발협력 NGO 협의체로 1999년 설립된 것은?',o:['KoFID','KCOC','KOFIH','KODAC'],a:1,e:'KCOC(국제개발협력민간협의회, 1999)가 NGO 협의체다. KoFID(2010)는 부산총회 대비 시민사회포럼, KOFIH(2006)는 보건의료재단이다.'},
  {q:'개도국으로 유입되는 자금 중 ODA보다 규모가 큰 것으로 거론되는 것은?',o:['해외이주노동자 송금(remittance)','UN 분담금','기후재원','채무탕감'],a:0,e:'개도국 유입 송금은 2023년 약 6,560억 달러로 DAC ODA(약 2,237억)의 3배 수준이다. AAAA는 송금 수수료 인하(3% 미만, SDG 10.c)를 목표로 삼았다.'},
 ]},
 {id:'p1-5',subj:1,name:'한국의 국제개발협력',qs:[
  {q:'한국의 수원 역사에 관한 설명으로 옳지 않은 것은?',o:['1945~1999년 약 127억 달러 수원','1995년 세계은행 차관 졸업','2000년 DAC 수원국 목록에서 제외','2010년 DAC 수원국 목록에서 제외'],a:3,e:'한국은 2000년 수원국 목록에서 빠졌고, 2010년은 DAC에 공여국으로 가입한 해다. 수원국에서 공여국으로 전환한 유일한 사례로 꼽힌다.'},
  {q:'한국 ODA 추진체계에서 유상원조 주관기관과 시행기관은?',o:['외교부 — KOICA','기획재정부 — 한국수출입은행(EDCF)','국무조정실 — KDI','산업부 — KOTRA'],a:1,e:'유상은 기재부 주관·수출입은행(EDCF) 시행, 무상은 외교부 주관·KOICA 시행이다. 국무조정실은 국제개발협력위원회 사무국·간사다.'},
  {q:'국제개발협력위원회에 관한 설명으로 옳은 것은?',o:['위원장은 외교부 장관','2006년 설치, 위원장은 국무총리','기획재정부 소속 자문기구','사무국은 KOICA'],a:1,e:'위원회는 2006년 국무총리 소속으로 설치되어 ODA 정책을 심의·조정·의결한다. 위원 30인 이내, 사무국은 국무조정실, 실무위원장은 국무2차장이다.'},
  {q:'KOICA와 EDCF의 설립연도 짝으로 옳은 것은?',o:['KOICA 1987, EDCF 1991','KOICA 1991, EDCF 1987','KOICA 1995, EDCF 1991','KOICA 2010, EDCF 2006'],a:1,e:'EDCF(대외경제협력기금)가 1987년 먼저 설립되고 KOICA(한국국제협력단)는 1991년 설립됐다. 순서를 뒤집는 함정이 자주 나온다.'},
  {q:'국제개발협력기본법에 관한 설명으로 옳지 않은 것은?',o:['2010년 1월 제정, 7월 시행','2020년 전부개정','종합기본계획은 3년 단위 수립','종합시행계획은 매년 수립'],a:2,e:'종합기본계획은 5년 단위(1차 2011~15, 2차 2016~20, 3차 2021~25, 4차 2026~30)이며 위원회가 의결한다.'},
  {q:'제3차 국제개발협력 종합기본계획(2021~2025)의 중점협력국 수는?',o:['24개국','26개국','27개국','30개국'],a:2,e:'1차 26개 → 2차 24개 → 3차 27개국(아시아 12·아프리카 7·중남미 4·중동/CIS 4). 4차 계획에서 재조정이 예고됐다.'},
  {q:'2026년 2월 의결된 제4차 국제개발협력 종합기본계획(2026~2030)의 4대 전략목표에 해당하지 않는 것은?',o:['포용적 가치 실현','호혜적 상생 확대','혁신적 개발 이행','수출 주도 성장 지원'],a:3,e:'4대 전략목표는 포용적 가치 실현·호혜적 상생 확대·혁신적 개발 이행·통합적 체계 구축이다. AI·문화를 중점분야로 추가하고 제안형 ODA, 사업실명제를 도입했다.'},
  {q:'2026년 한국 ODA 종합시행계획 규모와 특징으로 옳은 것은?',o:['6조 5,010억원, 41개 기관','5조 4,372억원, 37개 기관 1,763개 사업','3조 6,028억원, 외교부 단독','7조원 돌파, 역대 최대'],a:1,e:'2026년은 5조 4,372억원(전년 6조 5,010억 대비 16.4% 감소), 37개 기관·1,763개 사업이다. 교통 28.2%, 아시아 30.4% 비중이 가장 크다.'},
  {q:'한국 ODA의 구조적 특징으로 옳지 않은 것은?',o:['DAC 평균보다 유상 비중이 높다','아시아 지역 집중도가 높다','경제인프라(교통·에너지) 비중이 크다','DAC 평균보다 비구속화율이 높다'],a:3,e:'한국은 비구속화율이 DAC 평균(약 80~90%)에 미달해 동료검토 때마다 비구속화 확대를 권고받는다. 무상:유상 약 6:4로 유상 비중이 높고 아시아 집중이다.'},
  {q:'출국 항공권 1매당 1,000원을 부과하여 질병퇴치 재원으로 쓰는 한국의 혁신적 재원은?',o:['국제빈곤퇴치기여금(항공권 연대기여금)','녹색기후기금','글로벌 펀드 분담금','해외긴급구호기금'],a:0,e:'2007년 도입된 국제빈곤퇴치기여금은 2017년 글로벌질병퇴치기금으로 확대됐고 KOICA가 운용한다. 프랑스 등 UNITAID 항공권 연대세 모델을 참고했다.'},
  {q:'OECD DAC 평가 6대 기준 중 2019년 개정으로 새로 추가된 것은?',o:['적절성(Relevance)','정합성(Coherence)','영향력(Impact)','지속가능성(Sustainability)'],a:1,e:'1991년 5대 기준(적절성·효과성·효율성·영향력·지속가능성)에 2019년 정합성이 추가되어 6대 기준이 됐다.'},
  {q:'2009년 출범한 한국 해외봉사단 통합 브랜드는?',o:['KOV','World Friends Korea(WFK)','Peace Corps Korea','Global Korea'],a:1,e:'WFK는 KOICA·NIA·교육부 등 부처별로 흩어진 봉사단을 2009년 통합한 브랜드로 KOICA 봉사단·중장기자문단·드림봉사단 등을 포괄한다.'},
 ]},
 {id:'p2-1',subj:2,name:'교육',qs:[
  {q:'"모두를 위한 교육(EFA)"이 선언된 회의와 연도는?',o:['1990 좀티엔 세계교육회의','2000 다카르 세계교육포럼','2015 인천 세계교육포럼','1948 세계인권선언'],a:0,e:'1990 좀티엔(태국)에서 EFA 선언 → 2000 다카르에서 EFA 6대 목표(2015 시한) → 2015 인천선언·교육 2030 실행계획으로 이어진다.'},
  {q:'SDG 4의 세부목표 4.7이 다루는 내용은?',o:['초·중등 무상교육 완료','영유아 발달·취학전 교육','지속가능발전교육·세계시민교육','교사 확충'],a:2,e:'4.1 초중등, 4.2 영유아, 4.3 고등·직업교육, 4.4 취업기술, 4.5 격차 해소, 4.6 문해·수리, 4.7 ESD·GCED, 4.a 시설, 4.b 장학금, 4.c 교사다.'},
  {q:'세계은행이 2019년 제시한 "학습 빈곤(learning poverty)"의 정의는?',o:['학교에 다니지 못하는 아동 비율','10세까지 간단한 글을 읽고 이해하지 못하는 아동 비율','중등교육 미이수율','성인 문맹률'],a:1,e:'학습 빈곤은 10세 아동 중 간단한 글을 읽지 못하는 비율로, 저·중소득국에서 코로나19 이후 약 70%로 추정된다. MDG2가 취학률에서 SDG4가 학습 성과로 초점을 옮긴 배경이다.'},
  {q:'SDG 4 이행을 총괄 조정하고 세계교육현황보고서(GEM Report)를 발간하는 기구는?',o:['UNICEF','UNESCO','세계은행','GPE'],a:1,e:'UNESCO가 SDG4 조정기구이자 GEM 보고서 발간처다. GPE(2002 FTI → 2011)는 교육 재원 파트너십, ECW(2016)는 위기 시 교육 기금이다.'},
  {q:'2015년 세계교육포럼이 개최된 한국 도시와 채택 문서는?',o:['서울 — 서울선언','부산 — 부산선언','인천 — 인천선언','대전 — 대전행동강령'],a:2,e:'2015년 5월 인천 송도에서 세계교육포럼이 열려 인천선언이 채택되고, 그해 11월 교육 2030 실행계획(FFA)이 확정됐다.'},
  {q:'교육 ODA에서 TVET이 뜻하는 것은?',o:['기술·직업교육훈련','교사 역량 강화 프로그램','취학전 교육','원격 교육 플랫폼'],a:0,e:'TVET(Technical and Vocational Education and Training)은 SDG 4.3·4.4와 연결되며 KOICA 교육 ODA 4축(기초교육·TVET·고등교육·이러닝) 중 하나다.'},
  {q:'학교 밖 교육처럼 조직적이지만 정규 학제 밖에서 이루어지는 교육을 가리키는 용어는?',o:['형식교육(formal)','비형식교육(non-formal)','무형식교육(informal)','의무교육'],a:1,e:'형식교육은 정규 학제, 비형식교육은 학제 밖의 조직된 교육(문해교실·직업훈련), 무형식교육은 일상 속 비조직적 학습이다.'},
  {q:'서울에 있는 유네스코 카테고리 2 기관으로 세계시민교육(GCED) 거점 역할을 하는 곳은?',o:['IVI','APCEIU','GGGI','KDI School'],a:1,e:'아태국제이해교육원(APCEIU, 2000)은 SDG 4.7 세계시민교육의 글로벌 거점이다. IVI는 백신, GGGI는 녹색성장 기구다.'},
 ]},
 {id:'p2-2',subj:2,name:'보건',qs:[
  {q:'"Health for All by 2000"을 내걸고 일차보건의료(PHC)를 선언한 1978년 회의는?',o:['알마아타 선언','오타와 헌장','아스타나 선언','방콕 헌장'],a:0,e:'1978 알마아타(카자흐스탄) 선언이 PHC 출발점이고, 40주년인 2018 아스타나(같은 카자흐스탄)에서 재확인됐다. 오타와 헌장(1986)은 건강증진 선언이다.'},
  {q:'SDG 3.8이 목표로 하는 것은?',o:['모성사망비 70 미만','보편적 건강보장(UHC)','담배규제협약 이행','비감염성질환 조기사망 1/3 감소'],a:1,e:'3.1 모성사망비, 3.4 NCD, 3.8 UHC, 3.a FCTC다. UHC는 재정적 어려움 없이 양질의 보건서비스를 이용하는 것으로 UHC 큐브(인구·서비스·비용 보장)로 설명된다.'},
  {q:'SDG 3.1의 2030년 모성사망비 목표는 출생 10만 명당?',o:['12 미만','25 미만','70 미만','100 미만'],a:2,e:'3.1 모성사망비 10만 명당 70 미만, 3.2 신생아 사망률 1,000명당 12 이하·5세 미만 25 이하다. 숫자를 바꿔 묻는 함정이 잦다.'},
  {q:'WHO 보건체계 6대 구성요소(building blocks)에 해당하지 않는 것은?',o:['보건인력','보건재정','의약품·백신·기술','교통 인프라'],a:3,e:'6대 요소는 서비스 전달·보건인력·보건정보체계·의약품/백신/기술·보건재정·리더십/거버넌스다.'},
  {q:'2002년 설립되어 에이즈·결핵·말라리아 3대 질병 퇴치를 지원하는 재원기구는?',o:['Gavi','세계기금(GFATM)','CEPI','UNAIDS'],a:1,e:'세계기금(Global Fund)은 2002년, Gavi(백신연합)는 2000년, CEPI(전염병대비혁신연합)는 2017년 오슬로에서 설립됐다. UNAIDS(1996)는 UN 공동프로그램이다.'},
  {q:'인간·동물·환경의 건강을 통합적으로 접근하는 개념은?',o:['원헬스(One Health)','UHC','글로벌보건안보','건강의 사회적 결정요인'],a:0,e:'원헬스는 인수공통감염병·항생제 내성 대응의 핵심 틀이다. 건강의 사회적 결정요인(SDH)은 소득·교육·주거 등 "원인의 원인"을 다룬다.'},
  {q:'한국 정부가 2003~2006년 배출한 WHO 사무총장은?',o:['반기문','이종욱','송상현','한승수'],a:1,e:'이종욱 박사는 한국인 최초 UN 전문기구 수장(WHO 사무총장)이다. 반기문은 UN 사무총장(2007~16), 송상현은 ICC 소장이다.'},
  {q:'1997년 서울에 본부를 둔, 한국이 유치한 최초의 국제기구는?',o:['GCF','GGGI','국제백신연구소(IVI)','APCEIU'],a:2,e:'IVI(1997)가 한국 유치 최초 국제기구다. GCF 사무국은 2013 송도, GGGI는 2012 국제기구 전환이다.'},
  {q:'질병부담을 조기사망과 장애를 합산해 측정하는 지표는?',o:['HDI','DALY','GII','MPI'],a:1,e:'DALY(장애보정생존연수)는 세계질병부담(GBD) 연구의 핵심 지표다. 역학적 전환으로 개도국은 감염병과 NCD의 이중부담을 안고 있다.'},
 ]},
 {id:'p2-3',subj:2,name:'농촌개발',qs:[
  {q:'1996년 세계식량정상회의가 정의한 식량안보 4대 요소는?',o:['생산·가격·유통·소비','가용성·접근성·활용성·안정성','영양·위생·안전·품질','토지·물·종자·시장'],a:1,e:'가용성(availability)·접근성(access)·활용성(utilization)·안정성(stability)이다. HLPE(2020)는 주체성(agency)·지속가능성 추가를 제안했다.'},
  {q:'로마에 본부를 둔 3대 식량·농업 기구가 아닌 것은?',o:['FAO','WFP','IFAD','CGIAR'],a:3,e:'로마 3대 기구는 FAO(1945)·WFP(1961)·IFAD(1977)다. CGIAR(1971)은 15개 국제농업연구센터 협의체로 IRRI(필리핀)·CIMMYT(멕시코) 등이 속한다.'},
  {q:'SDG 2.3의 내용은?',o:['기아 종식','소농의 생산성·소득 2배 증대','종자 유전자원 보존','식량가격 안정'],a:1,e:'2.1 기아 종식, 2.2 영양불량 종식, 2.3 소농 생산성·소득 2배, 2.4 지속가능 식량체계, 2.5 유전자원, 2.c 식량가격 안정이다.'},
  {q:'녹색혁명의 주역으로 1970년 노벨평화상을 받은 인물은?',o:['노먼 볼로그','로버트 챔버스','아마르티아 센','무하마드 유누스'],a:0,e:'볼로그는 고수확 밀 품종 개발로 수상했다. 챔버스는 참여적 농촌평가(PRA), 유누스는 마이크로크레딧(2006 노벨평화상)이다.'},
  {q:'DFID(1999)가 체계화한 지속가능 생계접근(SLA)의 5대 자본에 해당하지 않는 것은?',o:['인적 자본','사회적 자본','자연 자본','정치적 자본'],a:3,e:'SLA 5대 자본은 인적·사회·자연·물적·금융 자본이다.'},
  {q:'새마을운동 기록물이 유네스코 세계기록유산에 등재된 연도는?',o:['1970','2000','2013','2021'],a:2,e:'새마을운동(1970~, 근면·자조·협동) 기록물은 2013년 등재됐다. KOICA 새마을 ODA, 농진청 KOPIA(2009)가 한국 농촌개발 ODA의 대표 축이다.'},
  {q:'2023년 FAO 등 5개 기구의 SOFI 보고서 기준 세계 기아 인구는 약?',o:['2억 명','4.5억 명','7.3억 명','12억 명'],a:2,e:'2022년 기준 약 7.35억 명(세계 인구 9.2%)이 기아 상태이며, 중등도 이상 식량불안 인구는 약 24억 명이다. 원인은 분쟁·기후·코로나(3C)와 비용 상승이다.'},
  {q:'농촌개발 접근법의 시대별 변천 순서로 옳은 것은?',o:['가치사슬 → 통합농촌개발 → 공동체개발','공동체개발 → 통합농촌개발(IRD) → 지속가능생계(SLA) → 가치사슬·시장 접근','SLA → IRD → 공동체개발 → 기후스마트농업','통합농촌개발 → 공동체개발 → 가치사슬'],a:1,e:'1950년대 공동체개발 → 1970년대 세계은행 IRD → 1980년대 구조조정 → 1990년대 SLA·PRA → 2000년대 가치사슬·시장 접근 → 기후스마트농업(CSA, 2010)·디지털 농업 순이다.'},
 ]},
 {id:'p2-4',subj:2,name:'거버넌스·평화',qs:[
  {q:'"소극적 평화"와 "적극적 평화"를 구분한 학자는?',o:['요한 갈퉁','부트로스 갈리','코피 아난','메리 앤더슨'],a:0,e:'갈퉁은 직접폭력 부재(소극적)와 구조적 폭력 부재(적극적)를 구분했다. 갈리는 1992 『평화를 위한 의제』, 앤더슨은 Do No Harm(1999)이다.'},
  {q:'1992년 UN 사무총장 부트로스 갈리의 『평화를 위한 의제』가 제시한 개념이 아닌 것은?',o:['예방외교','평화조성(peacemaking)','평화구축(peacebuilding)','보호책임(R2P)'],a:3,e:'『평화를 위한 의제』는 예방외교·평화조성·평화유지·평화구축 4개념을 제시했다. R2P는 2005 UN 세계정상회의에서 채택됐다.'},
  {q:'2011년 부산총회에서 g7+ 주도로 채택된 "취약국 개입을 위한 뉴딜"의 평화구축·국가건설 목표(PSG) 수는?',o:['3개','5개','8개','12개'],a:1,e:'PSG 5개: 정당한 정치, 안보, 정의, 경제 기반, 세입·서비스. 뉴딜은 취약국 자신(g7+)이 주도한 점이 특징이다.'},
  {q:'인도적 지원 4원칙 중 2004년 UN 총회 결의 58/114로 추가된 것은?',o:['인도성','중립성','공정성','독립성'],a:3,e:'인도성·중립성·공정성은 1991 결의 46/182(OCHA 설립 근거)에, 독립성은 2004 결의 58/114에 추가됐다.'},
  {q:'인도·개발·평화 넥서스(HDP Nexus, 삼중 넥서스)가 본격 논의된 2016년 회의는?',o:['세계인도주의정상회의(WHS, 이스탄불)','GPEDC 나이로비 회의','리우+20','아디스아바바 개발재원총회'],a:0,e:'2016 WHS에서 삼중 넥서스와 Grand Bargain(현지화·현금지원)이 합의되고, 2019 OECD DAC 권고로 제도화됐다.'},
  {q:'UNESCAP이 제시한 굿거버넌스 8요소에 해당하지 않는 것은?',o:['참여','법치','책무성','경제성장률'],a:3,e:'8요소는 참여·법치·투명성·대응성·합의지향·형평성과 포용·효과성과 효율성·책무성이다. 세계은행 WGI는 6개 차원(카우프만)이다.'},
  {q:'국제투명성기구(TI)가 1995년부터 발표하는 부패 지표는?',o:['WGI','CPI(부패인식지수)','HDI','GII'],a:1,e:'CPI는 각국 공공부문 부패 인식을 0~100으로 지수화한다. WGI는 세계은행 거버넌스지표, GII는 UNDP 성불평등지수다.'},
  {q:'여성·평화·안보(WPS) 의제의 출발점이 된 2000년 UN 안보리 결의는?',o:['결의 1325','결의 46/182','결의 2626','결의 70/1'],a:0,e:'결의 1325(2000)는 분쟁 과정에서 여성 참여·보호를 규정했다. 46/182는 인도지원 조정(1991), 2626은 0.7%(1970), 70/1은 SDGs(2015)다.'},
  {q:'한국의 해외 재난 긴급구호를 위해 2007년 제정된 법과 파견 조직은?',o:['국제개발협력기본법 — KOICA','해외긴급구호에 관한 법률 — 해외긴급구호대(KDRT)','재난안전법 — 중앙재난안전대책본부','외무공무원법 — 재외공관'],a:1,e:'해외긴급구호에 관한 법률(2007)에 따라 KDRT(Korea Disaster Relief Team)가 구성·파견된다. 외교부·KOICA·소방청·국방부 등이 참여한다.'},
 ]},
 {id:'p2-5',subj:2,name:'기후행동',qs:[
  {q:'UN 기후변화협약(UNFCCC)이 채택된 회의와 발효 연도는?',o:['1992 리우, 1994 발효','1997 교토, 2005 발효','2015 파리, 2016 발효','1988 토론토, 1990 발효'],a:0,e:'UNFCCC는 1992 리우 지구정상회의에서 채택되어 1994년 발효됐으며 "공동의 그러나 차별화된 책임(CBDR)"을 원칙으로 한다.'},
  {q:'교토의정서(1997)의 선진국 감축 목표는?',o:['1990년 대비 5.2% (2008~12)','2005년 대비 20%','1990년 대비 40%','2018년 대비 40%'],a:0,e:'교토의정서는 부속서 I 국가에 1990년 대비 평균 5.2% 감축 의무를 부과하고 CDM·배출권거래·공동이행 3개 유연성 체제를 도입했다. 2005년 발효.'},
  {q:'파리협정(2015)에 관한 설명으로 옳지 않은 것은?',o:['산업화 이전 대비 2℃ 훨씬 아래, 1.5℃ 노력','모든 당사국이 NDC 제출','NDC는 10년 주기로 갱신','2023년 첫 글로벌 이행점검(GST)'],a:2,e:'NDC(국가결정기여)는 5년 주기로 제출·상향한다. 교토와 달리 선진국·개도국 모두 참여하는 상향식(bottom-up) 체제다.'},
  {q:'2009년 코펜하겐(COP15)에서 선진국이 약속한 기후재원 규모는?',o:['2020년까지 연 1,000억 달러','2030년까지 연 500억 달러','2035년까지 연 3,000억 달러','연 1조 달러'],a:0,e:'코펜하겐 약속은 2020년까지 연 1,000억 달러였고, 2024 바쿠(COP29)에서 신규 목표(NCQG)로 2035년까지 연 3,000억 달러가 합의됐다.'},
  {q:'손실과 피해(Loss and Damage) 기금 설립이 합의된 회의는?',o:['COP21 파리(2015)','COP26 글래스고(2021)','COP27 샤름엘셰이크(2022)','COP28 두바이(2023)'],a:2,e:'COP27(2022)에서 기금 설립 합의, COP28(2023)에서 운영화와 화석연료 전환 명시가 이뤄졌다.'},
  {q:'녹색기후기금(GCF)에 관한 설명으로 옳은 것은?',o:['2010 칸쿤 합의, 2013 인천 송도 사무국','1991 설립, 워싱턴 본부','교토 CDM 수익 2%로 조성','1988 WMO·UNEP 공동 설립'],a:0,e:'GCF는 2010 칸쿤(COP16)에서 설립 합의, 2013년 송도에 사무국을 열었다. 1991은 GEF, CDM 수익 2%는 적응기금, 1988 WMO·UNEP는 IPCC다.'},
  {q:'한국의 2030 NDC와 탄소중립 목표로 옳은 것은?',o:['2018년 대비 40% 감축, 2050 탄소중립','1990년 대비 5.2% 감축, 2060 탄소중립','2005년 대비 26% 감축, 2070 탄소중립','2018년 대비 24.4% 감축, 2050 탄소중립'],a:0,e:'한국은 2020년 2050 탄소중립을 선언하고 2021년 NDC를 2018년 대비 40%로 상향했다(종전 26.3%). P4G 서울정상회의(2021)도 같은 해다.'},
  {q:'OECD DAC가 기후·생물다양성·사막화 관련 ODA를 표기하는 통계 도구는?',o:['젠더 마커','리우 마커','장애 마커','CRS 목적코드'],a:1,e:'리우 마커는 감축·적응·생물다양성·사막화 4개로 1992 리우 3협약(UNFCCC·CBD·UNCCD)에 대응한다. 기후 ODA는 DAC 전체의 약 30%다.'},
  {q:'2022년 채택된 쿤밍-몬트리올 글로벌 생물다양성 프레임워크의 대표 목표는?',o:['2030년까지 육상·해양 30% 보호(30 by 30)','2050 탄소중립','산림벌채 제로','플라스틱 전면 금지'],a:0,e:'CBD COP15(2022)에서 2030년까지 육지·해양 30% 보전(30 by 30) 등 23개 목표가 합의됐다.'},
 ]},
 {id:'p2-6',subj:2,name:'과학기술혁신',qs:[
  {q:'SDG 9.c의 내용은?',o:['R&D 투자 확대','2020년까지 최빈국 보편적 인터넷 접근','청정기술 산업 전환','소기업 금융 접근'],a:1,e:'9.5 R&D·연구인력, 9.4 청정기술, 9.3 소기업 금융, 9.c LDC 보편적 인터넷 접근이다. SDG 17.6~17.8(기술 메커니즘·LDC 기술은행)과 함께 출제된다.'},
  {q:'2015년 AAAA·SDGs로 출범한 기술촉진메커니즘(TFM)의 구성요소가 아닌 것은?',o:['UN 기관간 태스크팀','STI 포럼','온라인 플랫폼','WTO 기술이전위원회'],a:3,e:'TFM은 UN 기관간 태스크팀·연례 STI 포럼(2016~)·온라인 플랫폼 3요소다. LDC 기술은행은 2016년 튀르키예 게브제에 설립됐다.'},
  {q:'『작은 것이 아름답다』(1973)에서 "중간기술"을 제시해 적정기술 개념의 토대를 놓은 인물은?',o:['E.F. 슈마허','클라우스 슈밥','C.K. 프라할라드','마이클 포터'],a:0,e:'슈마허의 중간기술이 적정기술로 발전했다. 슈밥은 4차 산업혁명(2016), 프라할라드는 BoP 시장, 포터는 CSV(2011)다.'},
  {q:'케냐에서 2007년 시작되어 모바일 머니 리프로깅(leapfrogging)의 대표 사례가 된 서비스는?',o:['Aadhaar','M-Pesa','Alipay','bKash'],a:1,e:'M-Pesa(사파리콤)는 은행 인프라 없이 휴대전화로 금융 포용을 이룬 사례다. Aadhaar는 인도 디지털 ID(DPI 사례)다.'},
  {q:'디지털 ID·디지털 결제·데이터 교환 등 사회 전반이 공유하는 기반 시스템을 뜻하는 용어는?',o:['디지털 공공인프라(DPI)','적정기술','국가혁신체제(NIS)','리빙랩'],a:0,e:'DPI는 인도 스택(Aadhaar·UPI)이 대표 사례이며 2023 G20 의제였다. NIS는 프리먼·룬드발의 혁신체제론, 리빙랩은 사용자 참여 혁신 실험실이다.'},
  {q:'KOICA가 2015년 시작한 혁신기술 기반 스타트업 지원 프로그램은?',o:['CTS(Creative Technology Solution)','KOPIA','CIAT','WFK'],a:0,e:'CTS는 예비창업가·스타트업의 혁신기술을 개발협력 현장에 적용하는 프로그램이다. KOPIA는 농진청 농업기술, CIAT는 글로벌연수, WFK는 봉사단이다.'},
  {q:'ITU 2023년 기준 세계 인터넷 비사용 인구는 약?',o:['5억 명','13억 명','26억 명','40억 명'],a:2,e:'세계 인구의 약 67%가 인터넷을 사용하고 26억 명은 미접속 상태로, LDC·여성·농촌에 집중된 디지털 격차가 문제다.'},
  {q:'제4차 국제개발협력 종합기본계획(2026~30)에서 새로 중점분야로 추가된 두 영역은?',o:['AI·문화','보건·교육','농촌개발·거버넌스','기후·성평등'],a:0,e:'4차 기본계획은 전통 강점 분야(보건·교육·농촌·기후·공공행정)에 AI·문화를 추가하고 "AI 활용 개발협력 추진전략"(글로벌 AI 기본사회)을 수립했다.'},
 ]},
 {id:'p2-7',subj:2,name:'성평등',qs:[
  {q:'성주류화(gender mainstreaming)가 공식화된 1995년 회의는?',o:['멕시코시티 제1차 세계여성회의','나이로비 제3차 세계여성회의','베이징 제4차 세계여성회의','카이로 국제인구개발회의'],a:2,e:'베이징 선언·행동강령(12개 중대 관심분야)에서 성주류화가 공식화되고 1997 ECOSOC이 정의했다. 1차 멕시코 1975, 3차 나이로비 1985, ICPD 카이로 1994다.'},
  {q:'개발 접근법의 변천 순서로 옳은 것은?',o:['GAD → WAD → WID','WID → WAD → GAD','WAD → WID → GAD','WID → GAD → WAD'],a:1,e:'WID(개발 속의 여성, 1970s 보저럽) → WAD(여성과 개발, 1970s 후반) → GAD(젠더와 개발, 1980s 후반, 권력관계·구조 변화) → 성주류화 순이다.'},
  {q:'여성차별철폐협약(CEDAW)의 채택·발효 연도와 한국 가입 연도는?',o:['1979 채택, 1981 발효, 한국 1984 가입','1966 채택, 1976 발효, 한국 1990 가입','1989 채택, 1990 발효, 한국 1991 가입','1995 채택, 2000 발효, 한국 2001 가입'],a:0,e:'CEDAW는 1979 채택·1981 발효, 한국은 1984년 가입했다. 1966·1976은 국제인권규약, 1989·1990은 아동권리협약이다.'},
  {q:'OECD DAC 젠더평등 정책마커에서 "2"가 뜻하는 것은?',o:['성평등과 무관','성평등이 부분 목표','성평등이 사업의 주목표','성평등 관련 데이터 없음'],a:2,e:'마커 0 무관, 1 부분 목표(significant), 2 주목표(principal)다. 한국은 젠더마커 비율이 DAC 평균보다 낮다는 지적을 동료검토에서 받았다.'},
  {q:'UN Women 설립 연도와 통합된 기구가 아닌 것은?',o:['2010 — UNIFEM','2010 — DAW','2010 — INSTRAW','2010 — UNFPA'],a:3,e:'UN Women(2010)은 UNIFEM·DAW·OSAGI·INSTRAW 4개를 통합했다. UNFPA(인구기금)는 별도 기구다.'},
  {q:'1994년 카이로 국제인구개발회의(ICPD)에서 정립된 개념은?',o:['성·생식보건과 권리(SRHR)','성주류화','교차성','여성 경제역량 강화(WEE)'],a:0,e:'ICPD 행동계획은 인구 통제에서 개인의 SRHR로 패러다임을 전환했다. SDG 5.6과 3.7이 이를 계승한다.'},
  {q:'몰리뉴·모저가 구분한 젠더 욕구 중 "여성의 종속적 지위 자체를 변화시키는 것"을 가리키는 것은?',o:['실질적 젠더 욕구','전략적 젠더 욕구','기본 욕구','경제적 욕구'],a:1,e:'실질적(practical) 욕구는 현재 역할 수행에 필요한 물·연료·보건 등, 전략적(strategic) 욕구는 권력관계·법·임금 평등 등 구조 변화를 뜻한다(GAD 핵심 도구).'},
  {q:'세계경제포럼(WEF)이 2006년부터 발표하는 성평등 지표는?',o:['GII','GDI','성격차지수(GGI)','HDI'],a:2,e:'GGI(Global Gender Gap Index)는 경제·교육·보건·정치 4부문이다. GII·GDI는 UNDP 지표다.'},
 ]},
 {id:'p2-8',subj:2,name:'인권',qs:[
  {q:'"국제인권장전"을 구성하는 세 문서는?',o:['UDHR·CEDAW·CRC','UDHR·ICCPR·ICESCR','ICCPR·ICESCR·CAT','UDHR·CRPD·ICERD'],a:1,e:'1948 세계인권선언(UDHR) + 1966 자유권규약(ICCPR)·사회권규약(ICESCR, 1976 발효)이 국제인권장전이다.'},
  {q:'인권기반접근(HRBA)에서 국가(정부)와 시민의 위치로 옳은 것은?',o:['국가 = 권리보유자, 시민 = 의무담지자','국가 = 의무담지자, 시민 = 권리보유자','둘 다 권리보유자','둘 다 의무담지자'],a:1,e:'HRBA(2003 UN 공동이해)는 시민을 권리보유자, 국가를 의무담지자로 보며 욕구 기반에서 권리 기반으로 전환한다. 원칙은 보편성·불가분성·평등·참여·책무성이다.'},
  {q:'UN 인권이사회에 관한 설명으로 옳은 것은?',o:['1946년 설립, 53개국','2006년 인권위원회를 대체, 47개국, 보편적 정례검토(UPR) 운영','안보리 산하 기구','조약기구의 하나'],a:1,e:'인권이사회(2006)는 총회 산하 47개국 체제로 UPR(4.5년 주기)을 운영한다. 조약기구(CEDAW위원회 등)는 각 협약에 따른 별도 기구다.'},
  {q:'9대 핵심 인권조약 중 가장 많은 국가가 비준한 것은?',o:['자유권규약(ICCPR)','아동권리협약(CRC)','고문방지협약(CAT)','장애인권리협약(CRPD)'],a:1,e:'CRC(1989)는 미국을 제외한 거의 모든 국가가 비준했다. CRC 4대 원칙은 비차별·아동 최선의 이익·생존과 발달·참여다.'},
  {q:'장애인권리협약(CRPD)의 채택 연도와 국제협력 조항, DAC 장애 마커 도입 연도는?',o:['2006 채택, 32조, 2018 마커','1989 채택, 28조, 2010 마커','2008 채택, 24조, 2020 마커','1993 채택, 11조, 2015 마커'],a:0,e:'CRPD는 2006 채택(한국 2008 비준), 32조가 국제협력을 규정하고 DAC 장애 마커는 2018년 도입됐다. 세계 인구 16%(13억)가 장애인이다.'},
  {q:'기업과 인권 이행원칙(UNGP, 2011)의 3축은?',o:['보호·존중·구제','참여·투명·책무','예방·대응·회복','인도·중립·공정'],a:0,e:'존 러기가 설계한 UNGP는 국가의 보호 의무·기업의 존중 책임·피해자의 구제 접근 3축이다.'},
  {q:'1993년 비엔나 세계인권회의의 성과로 옳지 않은 것은?',o:['인권의 보편성·불가분성 재확인','UN 인권최고대표사무소(OHCHR) 설립 권고','발전권 선언 채택','비엔나 선언·행동계획 채택'],a:2,e:'발전권 선언은 1986년 UN 총회에서 채택됐다. 비엔나(1993)는 이를 재확인하고 OHCHR 설립(1993년 말)을 이끌었다.'},
  {q:'ILO 핵심협약의 수와 2022년 추가된 주제는?',o:['8개, 산업안전보건 추가 없음','10개, 산업안전보건 추가','5개, 아동노동 추가','12개, 이주노동 추가'],a:1,e:'ILO 핵심협약은 결사의 자유·강제노동·아동노동·차별 8개에 2022년 산업안전보건 2개가 추가되어 10개다. 양질의 일자리(decent work)는 SDG 8이다.'},
  {q:'개발협력 사업에서 성착취·성학대·성희롱(SEAH) 방지를 위한 OECD DAC 권고가 채택된 연도는?',o:['2008','2015','2019','2023'],a:2,e:'2019년 DAC SEAH 종식 권고가 채택됐다. 같은 해 DAC 평가 6기준 개정, HDP 넥서스 권고도 나왔다(2019년 묶어 암기).'},
 ]},

const EXTRA={

  {q:'기타공적자금(OOF)의 대표적인 예는?',o:['개도국 공무원 초청 연수','공적수출신용(수출보험·수출금융)','NGO 기부금','외국인직접투자(FDI)'],a:1,e:'OOF는 공적 자금이지만 개발 목적이 아니거나 양허성에 미달하는 흐름(수출신용 등)이다. NGO 기부는 민간증여, FDI는 민간자금흐름이다.'},
  {q:'다음 중 양자 무상원조의 "기술협력"에 해당하지 않는 것은?',o:['연수생 초청','전문가 파견','봉사단 파견','채무탕감'],a:3,e:'기술협력은 인적 자원·지식 이전(연수·전문가·봉사단·개발조사)이다. 채무탕감은 별도 무상원조 유형이며 2000년대 초 HIPC 이니셔티브 때 ODA 통계를 크게 부풀렸다.'},
  {q:'지니계수에 관한 설명으로 옳은 것은?',o:['0에 가까울수록 불평등','1에 가까울수록 불평등, 로렌츠곡선 기반','0~100 범위, 빈곤율 측정','1인당 GNI와 동일 개념'],a:1,e:'지니계수는 로렌츠곡선과 완전평등선 사이 면적 비율로 0(완전평등)~1(완전불평등)이다. 소득분배 불평등을 측정하며 빈곤율과는 다르다.'},
  {q:'인간개발지수(HDI)를 창안한 UNDP 경제학자는?',o:['마붑 울 하크','제프리 삭스','윌리엄 이스털리','조지프 스티글리츠'],a:0,e:'파키스탄 경제학자 마붑 울 하크가 아마르티아 센과 함께 1990년 첫 인간개발보고서에서 HDI를 발표했다.'},
  {q:'"워싱턴 컨센서스"라는 용어를 1989년 처음 사용한 경제학자는?',o:['밀턴 프리드먼','존 윌리엄슨','폴 크루그먼','로버트 솔로'],a:1,e:'윌리엄슨이 IMF·세계은행·미 재무부가 중남미에 권고한 10개 정책(재정긴축·민영화·무역자유화 등)을 정리해 명명했다. 스티글리츠는 이를 비판하며 포스트워싱턴컨센서스를 제시했다.'},
  {q:'종속이론과 가장 관련 깊은 인물·기관은?',o:['로스토 — 세계은행','프레비시 — UN 라틴아메리카경제위원회(ECLA)','윌리엄슨 — IMF','센 — UNDP'],a:1,e:'프레비시는 ECLA(ECLAC)에서 중심-주변 구조론을 제기했고 1964년 UNCTAD 초대 사무총장이 됐다. 프랑크·월러스틴(세계체제론)도 종속이론 계열이다.'},
  {q:'DAC 수원국 목록의 개정 주기와 졸업 요건으로 옳은 것은?',o:['매년 개정, 고소득국 진입 즉시 졸업','3년마다 개정, 고소득국 3년 연속 유지 시 졸업','5년마다 개정, UN 결의로 졸업','10년마다 개정, 공여국 동의로 졸업'],a:1,e:'DAC 수원국 목록은 3년 주기로 개정되며, 세계은행 고소득국 기준을 3년 연속 충족하면 졸업한다. 한국은 2000년 제외됐다.'},
  {q:'2019년 노벨경제학상을 받은 빈곤연구 방법론과 수상자로 옳은 것은?',o:['빅푸시 — 삭스','무작위통제실험(RCT) — 바네르지·뒤플로·크레머','역량접근 — 센','제도주의 — 아세모글루·로빈슨'],a:1,e:'바네르지·뒤플로(MIT J-PAL)·크레머는 RCT로 빈곤정책 효과를 실험 검증했다. 아세모글루·로빈슨·존슨은 2024년 수상이다.'},
  {q:'DAC 통계상 공여국 내 난민 수용 비용(in-donor refugee costs)에 관한 설명으로 옳은 것은?',o:['ODA에 전혀 계상할 수 없다','입국 후 첫 12개월 비용은 ODA 계상 가능','수원국에 전달된 것으로 간주된다','다자 ODA로 분류된다'],a:1,e:'DAC 규칙상 난민 입국 후 12개월간의 체류비용은 ODA로 계상할 수 있어 2022~23년 ODA 급증의 요인이 됐고, "실제 개도국에 가지 않는 ODA"라는 비판을 받는다.'},
  {q:'아세모글루·로빈슨 『국가는 왜 실패하는가』(2012)의 핵심 설명변수는?',o:['지리적 위치','문화·종교','포용적 제도 vs 착취적 제도','천연자원 보유량'],a:2,e:'정치·경제 제도가 포용적인가 착취적인가가 국가의 번영을 가른다는 제도주의 설명이다. 2024년 노벨경제학상 수상 근거가 됐다.'},
 ],
 'p1-2':[
  {q:'1950년 영연방 주도로 출범한 아시아·태평양 지역 개발협력 체제는?',o:['콜롬보 플랜','마셜 플랜','포인트 포','ASEAN'],a:0,e:'콜롬보 플랜은 스리랑카 콜롬보에서 출범한 아태 지역협력 틀로 한국도 1962년 가입했다.'},
  {q:'1964년 창설되어 프레비시가 초대 사무총장을 맡았고 G77 결성의 계기가 된 UN 기구는?',o:['UNDP','UNCTAD','UNIDO','UNEP'],a:1,e:'UN 무역개발회의(UNCTAD)는 개도국의 무역·개발 이익을 대변하며 제1차 총회에서 77개 개도국 그룹(G77)이 결성됐다.'},

  {q:'1982년 외채 지불유예(모라토리엄)를 선언해 개도국 외채위기의 시발점이 된 국가는?',o:['아르헨티나','브라질','멕시코','칠레'],a:2,e:'두 차례 오일쇼크(1973·79)와 금리 상승으로 1982년 멕시코가 모라토리엄을 선언했고, 1980년대 중남미는 구조조정과 "잃어버린 10년"을 겪었다.'},
  {q:'1996년 세계은행·IMF가 시작한 과다채무빈곤국 채무감면 이니셔티브는?',o:['HIPC','PRSP','MDRI','SAP'],a:0,e:'HIPC(Heavily Indebted Poor Countries) 이니셔티브는 1996년 출범, 1999년 강화되며 PRSP 수립을 조건으로 했다. MDRI(2005)는 다자채무 탕감이다.'},
  {q:'1992년 리우 지구정상회의의 결과물이 아닌 것은?',o:['의제21','UN 기후변화협약(UNFCCC)','생물다양성협약(CBD)','교토의정서'],a:3,e:'리우회의는 리우선언·의제21·UNFCCC·CBD·산림원칙을 산출했다. 교토의정서는 1997년 UNFCCC COP3에서 채택됐다. 사막화방지협약(UNCCD)은 1994년이다.'},

  {q:'GPEDC 제1차 고위급회의가 열린 도시와 연도는?',o:['멕시코시티 2014','나이로비 2016','제네바 2022','부산 2011'],a:0,e:'GPEDC는 2011 부산에서 합의되어 2012 출범했고, 1차 멕시코시티(2014), 2차 나이로비(2016), 3차 제네바 정상회의(2022)를 열었다.'},
  {q:'2002년 요하네스버그에서 열린 지속가능발전정상회의(WSSD)의 별칭은?',o:['리우+10','리우+20','스톡홀름+30','교토+5'],a:0,e:'WSSD는 1992 리우회의 10주년 회의로 "리우+10"이라 부른다. 리우+20은 2012 리우데자네이루 회의다.'},
  {q:'2003년 로마 제1차 원조효과성 고위급포럼의 핵심 주제는?',o:['주인의식','조화(harmonisation)','개발효과성','성과관리'],a:1,e:'로마선언은 공여국 간 절차 조화를 다뤘고, 이것이 파리선언(2005) 5원칙 중 하나로 흡수됐다.'},
  {q:'한국의 DAC 가입 결정일과 정식 가입일로 옳은 것은?',o:['2009.11.25 결정, 2010.1.1 가입','2008.11.25 결정, 2009.1.1 가입','2010.1.1 결정, 2011.1.1 가입','2005 결정, 2006 가입'],a:0,e:'2009년 11월 25일 DAC 특별회의에서 가입이 결정되고 2010년 1월 1일 24번째 회원국이 됐다. 같은 해 1월 국제개발협력기본법이 제정됐다.'},
  {q:'1970년대 ILO(1976)와 세계은행 맥나마라 총재가 주도한, 성장보다 빈곤층의 의식주·보건·교육 충족을 우선한 접근은?',o:['근대화론','기본욕구(BHN) 접근','구조조정','인간개발'],a:1,e:'기본욕구 접근은 낙수효과 실패에 대한 반성에서 나왔다. 1980년대 신자유주의 구조조정으로 밀렸다가 1990년대 인간개발로 계승됐다.'},

 'p1-3':[
  {q:'SDGs 초안을 작성한 공개작업반(OWG)의 구성으로 옳은 것은?',o:['5개 상임이사국','30석에 70개국이 공유','193개국 전원','DAC 회원국만'],a:1,e:'OWG는 30개 의석을 70개국이 나눠 쓰는 독특한 구성으로 2013~14년 활동해 17개 목표 제안서를 냈다.'},
  {q:'SDGs 이행 상황을 각국이 HLPF에 자발적으로 보고하는 제도는?',o:['UPR','VNR(자발적 국별리뷰)','동료검토','NDC'],a:1,e:'VNR은 SDGs 국별 이행보고다. UPR은 인권이사회 정례검토, 동료검토는 DAC, NDC는 파리협정 기여다.'},
  {q:'SDG 17.2가 재확인한 공여국의 ODA 목표는?',o:['GNI 0.2%','GNI 0.5%','GNI 0.7% (LDC 0.15~0.20%)','GNI 1.0%'],a:2,e:'SDG 17.2는 1970년 결의의 0.7% 목표와 LDC 대상 0.15~0.20%를 재확인했다. 2023년 달성국은 노르웨이·룩셈부르크·스웨덴·덴마크·독일 5개국이다.'},
  {q:'SDG 10.c가 2030년까지 목표로 한 이주노동자 송금 수수료 수준은?',o:['3% 미만','5% 미만','7% 미만','10% 미만'],a:0,e:'송금 수수료를 3% 미만으로 낮추고 5%를 넘는 송금 경로를 없애는 것이 목표다. 송금은 개도국 유입 자금 중 ODA보다 크다.'},
  {q:'SDGs 지표 체계를 개발·관리하는 UN 기구는?',o:['UNDP','UN 통계위원회 산하 IAEG-SDGs','세계은행','OECD DAC'],a:1,e:'기관간 전문가그룹(IAEG-SDGs)이 231개 지표를 관리하며 Tier 분류로 데이터 가용성을 구분한다.'},
  {q:'MDGs 기간(1990~2015) 극빈 인구 변화로 옳은 것은?',o:['19억 → 8.4억 명','30억 → 15억 명','10억 → 5억 명','변화 없음'],a:0,e:'MDG 1(극빈 절반 감소)은 2010년 조기 달성됐고 2015년 8.4억 명으로 줄었다. 다만 중국의 성장 효과가 컸고 사하라 이남은 부진했다.'},
  {q:'SDGs가 통합적으로 다루는 지속가능발전의 3대 차원은?',o:['정치·군사·외교','경제·사회·환경','빈곤·보건·교육','국가·시장·시민사회'],a:1,e:'SDGs는 경제·사회·환경 3차원을 통합(integration)하며, 특정 목표가 다른 목표에 미치는 상호연계(interlinkage)를 강조한다.'},
  {q:'5P 중 "Peace"에 직접 대응하는 SDG는?',o:['SDG 10','SDG 16','SDG 17','SDG 11'],a:1,e:'SDG 16(평화·정의·제도)이 Peace, SDG 17이 Partnership, SDG 1~5가 People, 6·12~15가 Planet, 7~11이 Prosperity에 대략 대응한다.'},
  {q:'총회급 SDG 정상회의(SDG Summit)의 개최 주기와 연도는?',o:['매년, 2016~','4년마다, 2019·2023','2년마다, 2017·2019','10년마다, 2025'],a:1,e:'HLPF는 ECOSOC 주관으로 매년, 총회급 SDG Summit은 4년마다 열려 2019년과 2023년(중간점검)에 개최됐다.'},
  {q:'한국 지속가능발전위원회의 2022년 변화로 옳은 것은?',o:['폐지','환경부 소속에서 국무총리 소속으로 격상','대통령 직속으로 격상','외교부로 이관'],a:1,e:'지속가능발전 기본법(2022 시행)으로 위원회가 국무총리 소속이 되고 K-SDGs 추진 체계가 정비됐다.'},
  {q:'2030 의제(SDGs)를 채택한 UN 총회 결의 번호는?',o:['결의 2626','결의 70/1','결의 46/182','결의 1325'],a:1,e:'결의 70/1 『Transforming our World: the 2030 Agenda for Sustainable Development』(2015.9.25)다. 2626은 0.7%(1970), 46/182는 인도지원(1991), 1325는 여성·평화·안보(2000)다.'},
 ],
 'p1-4':[
  {q:'2020년 영국이 DFID를 외무부와 통합해 만든 부처는?',o:['FCDO','DFAT','USAID','GIZ'],a:0,e:'영국은 2020년 DFID를 외무영연방부에 통합해 FCDO를 만들었다. 호주는 2013년 AusAID를 DFAT에 통합했다. GIZ는 독일 기술협력 시행기관이다.'},
  {q:'일본의 ODA 주관부처와 시행기관으로 옳은 것은?',o:['재무성 — JBIC','외무성 — JICA','경제산업성 — JETRO','총무성 — NHK'],a:1,e:'일본은 외무성이 정책을 총괄하고 JICA가 무상·유상·기술협력을 통합 시행한다(2008 통합). 한국은 무상·유상 시행기관이 분리된 구조다.'},
  {q:'중국의 대외원조 전담기구와 설립연도, 대표 구상으로 옳은 것은?',o:['CIDCA 2018, 일대일로(2013)','MOFCOM 2000, 신실크로드','AIIB 2015, 상하이협력기구','NDB 2014, 브릭스'],a:0,e:'중국은 2018년 국가국제발전합작서(CIDCA)를 신설했고 2013년부터 일대일로(BRI)를 추진한다. AIIB(2015 베이징)는 중국 주도 다자개발은행이다.'},
  {q:'1950년 설립되어 제네바에 본부를 둔 난민 보호 기구는?',o:['IOM','UNHCR','OCHA','UNRWA'],a:1,e:'UNHCR은 1951 난민협약 이행을 감독한다. IOM(1951)은 이주기구, OCHA는 인도지원조정실, UNRWA는 팔레스타인 난민 전담이다.'},
  {q:'에이즈·결핵·말라리아, 백신처럼 특정 질병·이슈에 재원을 집중하는 글로벌 펀드 방식을 일컫는 용어는?',o:['수평적 접근','수직적 기금(vertical fund)','예산지원','프로그램 원조'],a:1,e:'세계기금·Gavi 같은 수직적 기금은 성과가 뚜렷하지만 수원국 보건체계 전반(수평적 접근)을 약화시킬 수 있다는 비판을 받는다.'},
  {q:'세계 최대 민간 개발협력 공여 재단은?',o:['록펠러 재단','포드 재단','빌앤드멀린다게이츠 재단','오픈소사이어티 재단'],a:2,e:'게이츠재단은 보건(Gavi·세계기금·소아마비 퇴치)과 농업에 연 수십억 달러를 지원해 일부 DAC 회원국보다 큰 공여 규모다.'},
  {q:'마이클 포터·마크 크레이머가 2011년 제시한, 사회문제 해결과 기업 경쟁력을 동시에 추구하는 개념은?',o:['CSR','CSV(공유가치창출)','ESG','BoP'],a:1,e:'CSV는 CSR(사회적 책임, 비용)에서 한 걸음 나아가 사회적 가치 창출을 사업 전략에 통합한다. BoP는 프라할라드의 피라미드 저변 시장론이다.'},
  {q:'"피라미드의 저변(BoP)" 시장 개념을 제시한 학자는?',o:['C.K. 프라할라드','마이클 포터','무하마드 유누스','아마르티아 센'],a:0,e:'프라할라드는 연소득 수천 달러 이하 40억 인구를 소비자·생산자로 보는 포용적 비즈니스 접근을 제안했다.'},
  {q:'방글라데시에 본부를 둔 세계 최대 규모의 개발 NGO는?',o:['옥스팜','BRAC','케어','월드비전'],a:1,e:'BRAC(1972)은 마이크로파이낸스·교육·보건 사업으로 세계 최대 NGO로 꼽힌다. 옥스팜은 영국, 케어·월드비전은 미국 기반이다.'},
  {q:'개발금융기관(DFI)과 소속 국가 짝으로 옳지 않은 것은?',o:['DFC — 미국','BII — 영국','DEG — 독일','AFD — 일본'],a:3,e:'AFD는 프랑스 개발청이다. 일본은 JICA·JBIC, 네덜란드 FMO, 미국 DFC(2019, OPIC 후신)가 대표 DFI다.'},
  {q:'국제원조투명성기구(IATI)에 관한 설명으로 옳은 것은?',o:['2005 파리에서 출범, 한국 2010 가입','2008 아크라에서 출범, 한국 2015 가입·2016 공시','2011 부산에서 출범, 한국 미가입','2015 아디스아바바 출범'],a:1,e:'IATI는 아크라(2008)에서 출범한 원조정보 공개 표준이며 한국은 2015년 가입해 2016년부터 KOICA·EDCF 사업을 공시한다.'},
  {q:'DAC가 공여국 ODA 집행체계를 분류할 때 한국이 속하는 유형은?',o:['외교부 통합형(덴마크·노르웨이)','독립 전담기관형(과거 USAID)','무상·유상 분리형(외교부/KOICA, 기재부/EDCF)','재무부 단일형'],a:2,e:'한국은 무상(외교부·KOICA)과 유상(기재부·EDCF)이 분리된 체계로, 분절화와 조정 비용이 동료검토의 단골 지적이다.'},
 ],
 'p1-5':[
  {q:'한국의 최초 공여 활동으로 기록되는 것은?',o:['1963년 USAID 자금으로 개도국 연수생 초청','1987년 EDCF 설립','1991년 KOICA 설립','1977년 외무부 물자 지원'],a:0,e:'1963년 미국 USAID 자금을 받아 개도국 연수생을 초청한 것이 최초이며 1965년 정부 자체 재원 연수, 1967년 전문가 파견으로 이어졌다.'},
  {q:'1965년 한일 국교정상화로 유입되어 포항제철·경부고속도로 등에 쓰인 자금은?',o:['마셜플랜 자금','청구권 자금(무상 3억·유상 2억 달러)','IBRD 차관','UNKRA 원조'],a:1,e:'대일 청구권 자금은 무상 3억·유상 2억·상업차관 3억 달러로 1960~70년대 산업화 재원이 됐다. UNKRA는 1950년대 UN 한국재건단이다.'},
  {q:'KOICA의 개도국 공무원·전문가 초청 연수 사업의 명칭은?',o:['CIAT(글로벌연수)','CTS','WFK','IBS'],a:0,e:'CIAT(Capacity Improvement and Advancement for Tomorrow)는 연 수천 명을 초청하는 KOICA 대표 기술협력이다. CTS는 혁신기술, IBS는 포용적 비즈니스 프로그램이다.'},
  {q:'국제개발협력위원회 실무위원회의 위원장은?',o:['외교부 차관','국무조정실 국무2차장','기획재정부 차관','KOICA 이사장'],a:1,e:'실무위원회는 국무2차장이 위원장이며, 산하에 평가소위원회를 둔다. 본위원회 위원장은 국무총리다.'},
  {q:'제3차 국제개발협력 종합기본계획(2021~25)의 비전은?',o:['협력과 연대를 통한 글로벌 가치 및 상생의 국익 실현','세계와 함께하는 대한민국','인류 공동 번영과 세계평화 기여','글로벌 책임 강국'],a:0,e:'3차 계획은 이 비전 아래 포용적·상생하는·혁신적·함께하는 ODA 4대 전략을 세우고 2030년 ODA 2배(2019 대비) 목표를 제시했다.'},
  {q:'한국의 2023년 ODA 실적으로 옳은 것은?',o:['약 31.3억 달러, GNI 대비 0.18%, DAC 14위','약 20억 달러, 0.10%, DAC 20위','약 50억 달러, 0.30%, DAC 10위','약 11.7억 달러, 0.12%, DAC 18위'],a:0,e:'2023년 31.3억 달러(0.18%, 14위), 2024년 약 39.4억 달러(0.21%)다. 11.7억 달러는 DAC 가입 첫해인 2010년 실적이다.'},
  {q:'한국의 다자 ODA 분담에서 외교부와 기획재정부의 역할 구분으로 옳은 것은?',o:['외교부 — 세계은행·IMF / 기재부 — UN 기구','외교부 — UN 기구 분담금 / 기재부 — 세계은행·지역개발은행 출자','모두 외교부','모두 기재부'],a:1,e:'UN 등 국제기구 분담·기여금은 외교부, 다자개발은행(MDB)·IMF 출자·출연은 기재부가 담당한다.'},
  {q:'2020년 국제개발협력기본법 전부개정의 내용이 아닌 것은?',o:['통합평가체계 법제화','인도적 지원 근거 신설','개발협력 인력 양성 규정','KOICA와 EDCF 통합'],a:3,e:'전부개정은 위원회 기능 강화·통합평가·인도적 지원·인력양성·정보공개를 담았다. 무상·유상 시행기관 통합은 이뤄지지 않았고 4차 계획에서 무상기관 정비만 추진된다.'},
  {q:'2026년 종합시행계획에서 새로 도입된, 사업 담당 기관·책임자를 공개하는 제도는?',o:['사업실명제','성과계약제','예산총액배분제','주민참여예산제'],a:0,e:'사업실명제는 ODA 전 과정 정보공개 확대의 일환으로 2026년 도입됐다. 통합성과관리체계도 함께 신설됐다.'},
  {q:'제4차 기본계획이 원조 분절화 해소를 위해 제시한 목표는?',o:['시행기관을 100개로 확대','무상 시행기관을 절반 이상 정비(2030년까지 10여 개 수준)','유상원조 폐지','모든 ODA를 다자로 전환'],a:1,e:'2026년 약 40개인 무상 시행기관을 2030년까지 10여 개로 통합하고, 저성과 사업을 강력 구조조정하는 것이 4차 계획의 핵심이다.'},
  {q:'EDCF 차관의 일반적 조건으로 옳은 것은?',o:['금리 5~7%, 상환 10년','금리 0.01~2.5%, 상환 25~40년, 거치 7~15년','무이자, 상환 의무 없음','시장금리, 상환 5년'],a:1,e:'EDCF는 저금리·장기 양허성 차관으로 개발사업·기자재·민자사업(PPP)·프로그램 차관 등을 제공하며 교통·에너지 인프라 비중이 크다.'},
  {q:'한국 ODA 통합평가체계가 처음 도입된 연도는?',o:['2006','2009','2015','2020'],a:1,e:'2009년 "국제개발협력 통합평가체계"가 마련되고 2020년 기본법 개정으로 법제화됐다. 평가소위원회가 시행기관 자체평가의 메타평가를 수행한다.'},
  {q:'중점협력국 선정 절차로 옳은 것은?',o:['KOICA 이사장이 지정','종합기본계획에 따라 국제개발협력위원회가 의결','수원국 신청 순','UN이 지정'],a:1,e:'중점협력국은 5년 기본계획 수립 시 위원회가 의결하며 ODA의 약 70%를 집중한다. 4차 계획에서 재조정·중간평가가 예고됐다.'},
 ],
 'p2-1':[
  {q:'2000년 다카르 세계교육포럼이 설정한 EFA 6대 목표의 달성 시한은?',o:['2005','2010','2015','2030'],a:2,e:'다카르 EFA 6대 목표(영유아·초등 보편화·청소년 학습·성인 문해 절반·성평등·질)는 MDGs와 같은 2015년 시한이었다.'},
  {q:'2016년 설립된 분쟁·재난 등 위기 상황 교육 지원 글로벌 기금은?',o:['GPE','ECW(Education Cannot Wait)','UNICEF','GEM'],a:1,e:'ECW는 2016 WHS에서 출범했다. GPE(2002)는 교육 전반 파트너십, GEM은 UNESCO 보고서다.'},
  {q:'UNESCO 2023년 추산 세계 학교 밖 아동·청소년 수는 약?',o:['5천만 명','1억 명','2.5억 명','5억 명'],a:2,e:'약 2.5억 명이 학교 밖에 있으며 사하라 이남·분쟁지역·여아 비중이 높다. 2030년까지 교사 4,400만 명이 추가로 필요하다.'},
  {q:'2022년 UN 사무총장이 소집한 교육 관련 정상회의는?',o:['교육변혁정상회의(TES)','세계교육포럼','SDG Summit','세계인도주의정상회의'],a:0,e:'TES는 코로나19 학습 손실 이후 교육 체계 전환을 논의했고 2024년 미래정상회의와 연결된다.'},
  {q:'"학습 위기(learning crisis)"를 공식 제기한 세계은행 보고서는?',o:['WDR 2018 『Learning to Realize Education\'s Promise』','HDR 1990','GEM 2023','SOFI 2023'],a:0,e:'세계개발보고서(WDR) 2018은 취학은 늘었지만 학습이 일어나지 않는다며 학습 위기를 선언했다.'},
  {q:'SDG 4.1이 보장하는 무상·공평·양질의 교육 범위는?',o:['초등 6년','초등·중등 12년','취학전 1년','고등교육까지'],a:1,e:'4.1은 모든 아동의 초·중등(12년) 완료, 4.2는 취학전 1년 이상이다.'},
  {q:'코로나19로 교육이 중단된 학습자 수는 최대 약?',o:['1억 명','5억 명','16억 명','30억 명'],a:2,e:'2020년 봄 190여 개국 휴교로 최대 16억 명이 영향을 받았고 원격교육 격차와 학습 손실이 뒤따랐다.'},
  {q:'여아 교육 투자의 효과로 교재가 제시하는 내용이 아닌 것은?',o:['조혼 감소','아동 사망률 감소','임금 상승','군사비 증가'],a:3,e:'여아 교육은 다세대 효과(건강·소득·출산율·자녀 교육)가 커서 "가장 수익률 높은 투자"로 불린다.'},
  {q:'KOICA 교육 분야 중기전략의 4대 축으로 옳은 것은?',o:['기초교육·TVET·고등교육·이러닝(디지털교육)','초등·중등·대학·대학원','문해·수리·과학·영어','교사·교재·시설·급식'],a:0,e:'KOICA는 기초교육·직업기술교육·고등교육·디지털교육 4축으로 사업을 편성한다.'},
  {q:'한국 교육발전 경험 중 개발경험 공유의 대표 사례로 자주 언급되는 것은?',o:['1950년대 초등 의무교육 조기 달성','대학 등록금 자율화','사교육 시장 성장','영어 조기교육'],a:0,e:'전쟁 직후 초등 의무교육 완성과 "교육입국" 정책이 경제성장 기반이 됐다는 점이 KSP·연수 사업의 단골 내용이다.'},
 ],
 'p2-2':[
  {q:'UN 총회가 보편적 건강보장(UHC) 결의를 채택한 연도와 UHC의 날은?',o:['2012년, 12월 12일','2000년, 4월 7일','2015년, 9월 25일','1978년, 9월 12일'],a:0,e:'2012년 12월 12일 UN 총회 UHC 결의를 기념해 12월 12일이 UHC의 날이다. 4월 7일은 세계보건의 날(WHO 창립일)이다.'},
  {q:'알마아타 선언 40주년을 기념해 일차보건의료를 재확인한 2018년 선언은?',o:['오타와 헌장','아스타나 선언','방콕 헌장','리우 정치선언'],a:1,e:'알마아타(1978)와 아스타나(2018)는 모두 카자흐스탄 도시다. 연도로 구분하는 함정이 잦다.'},
  {q:'감염병의 국제적 확산에 대한 보고·대응 의무를 규정한 WHO 규범으로 2005년 개정된 것은?',o:['담배규제기본협약(FCTC)','국제보건규칙(IHR)','알마아타 선언','팬데믹 협정'],a:1,e:'IHR은 SARS(2003) 이후 2005년 개정되어 국제공중보건위기(PHEIC) 선포 체계를 담았다. FCTC(2003)는 담배규제, 팬데믹 협정은 2024~25년 협상이다.'},
  {q:'2014년 출범한 글로벌보건안보구상(GHSA)과 관련해 한국이 2015년 개최한 회의는?',o:['서울 GHSA 고위급회의','부산 세계보건총회','인천 세계교육포럼','제주 UHC 포럼'],a:0,e:'한국은 2015년 9월 GHSA 제2차 고위급회의를 서울에서 열었고 메르스 경험을 공유했다.'},
  {q:'WHO가 2016년 권고한 산전진료 횟수는?',o:['최소 2회','최소 4회','최소 8회','최소 12회'],a:2,e:'종전 4회 모델에서 2016년 8회 접촉 모델로 상향됐다. 숙련 분만 개조와 함께 모성사망 감소의 핵심 지표다.'},
  {q:'WHO가 지정한 소외열대질환(NTD)의 수는?',o:['5종','10종','20종','50종'],a:2,e:'NTD는 열대 빈곤지역에 집중된 20종(샤가스병·주혈흡충증·림프사상충증 등)으로 SDG 3.3이 종식을 목표로 한다.'},
  {q:'한국국제보건의료재단(KOFIH)의 설립연도와 소관부처는?',o:['1997, 외교부','2006, 보건복지부','2010, 교육부','1991, 외교부'],a:1,e:'KOFIH는 2006년 보건복지부 산하로 설립되어 보건의료 ODA·이종욱펠로우십을 운영한다.'},
  {q:'한국이 전 국민 건강보험을 달성하는 데 걸린 기간은?',o:['1977~1989년, 12년','1963~1977년, 14년','1989~2000년, 11년','1948~1960년, 12년'],a:0,e:'1977년 500인 이상 사업장 도입 후 1989년 도시 자영업자까지 적용해 12년 만에 전 국민 보장을 이뤘다. UHC 개발경험 공유의 대표 사례다.'},
  {q:'SDG 3.4가 2030년까지 목표로 한 비감염성질환(NCD) 관련 내용은?',o:['NCD 완전 종식','NCD 조기사망 1/3 감소·정신건강 증진','흡연율 절반','비만율 동결'],a:1,e:'심혈관·암·당뇨·만성호흡기 4대 NCD로 인한 30~70세 조기사망을 1/3 줄이는 것이다. 개도국은 감염병과 NCD 이중부담을 겪는다.'},
  {q:'2020년 코로나19 백신의 공평한 배분을 위해 WHO·Gavi·CEPI가 출범시킨 메커니즘은?',o:['COVAX','ACT-A 진단 축','PEPFAR','GHSA'],a:0,e:'COVAX는 ACT-Accelerator의 백신 축이다. PEPFAR는 미국의 에이즈 구호계획(2003)이다.'},
  {q:'건강의 사회적 결정요인(SDH)에 관한 WHO 위원회(2008) 보고서를 이끈 인물은?',o:['마이클 마멋','이종욱','그로 할렘 브룬트란트','테워드로스'],a:0,e:'마멋 위원회는 소득·교육·주거·노동 등 "원인의 원인"이 건강 격차를 만든다며 한 세대 안의 격차 해소를 촉구했다.'},
 ],
 'p2-3':[
  {q:'FAO 설립을 결정한 1943년 회의와 FAO 설립 연도는?',o:['브레튼우즈 1944, FAO 1945','핫스프링스 1943, FAO 1945','샌프란시스코 1945, FAO 1946','로마 1951, FAO 1952'],a:1,e:'미국 핫스프링스 식량농업회의(1943) 결과 1945년 FAO가 설립됐고 1951년 로마로 본부를 옮겼다.'},
  {q:'IFAD(국제농업개발기금) 설립의 직접적 계기가 된 회의는?',o:['1974 세계식량회의(로마)','1996 세계식량정상회의','2008 식량가격위기','1943 핫스프링스'],a:0,e:'1972~74 식량위기 후 1974 세계식량회의 결정으로 1977년 IFAD가 설립되어 소농·농촌빈곤층 금융을 전담한다.'},
  {q:'소농(smallholder)에 관한 설명으로 옳은 것은?',o:['경작지 10ha 미만, 세계 식량 10% 생산','경작지 2ha 미만, 약 5억 농가, 세계 식량 약 1/3 생산','대규모 기업농의 하청농','경작지 없이 임금만 받는 농업노동자'],a:1,e:'2ha 미만 소농이 약 5억 농가로 세계 식량의 약 1/3을 생산한다. SDG 2.3이 소농 생산성·소득 2배를 목표로 한다.'},
  {q:'"식량주권(food sovereignty)" 개념을 1996년 제기한 국제 농민운동 조직은?',o:['FAO','비아 캄페시나(La Via Campesina)','옥스팜','CGIAR'],a:1,e:'식량주권은 식량체계를 생산자·소비자가 스스로 결정할 권리를 뜻하며 시장 중심 식량안보 개념을 비판한다.'},
  {q:'FAO가 2010년 제시한 기후스마트농업(CSA)의 3대 목표는?',o:['생산성 증대·기후 적응·온실가스 감축','수출·가격·고용','종자·비료·관개','유기농·로컬푸드·공정무역'],a:0,e:'CSA는 생산성(식량안보)·적응(회복력)·감축(저탄소) 3축을 동시에 추구한다.'},
  {q:'농촌진흥청이 2009년 시작한 해외농업기술 협력사업은?',o:['KOPIA','KSP','CIAT','KDRT'],a:0,e:'KOPIA(해외농업기술개발사업)는 협력국에 센터를 두고 농업기술을 전수한다. KSP는 기재부 경제발전경험공유사업, KDRT는 긴급구호대다.'},
  {q:'2021년 UN 사무총장이 소집한 식량 관련 정상회의는?',o:['UN 식량체계정상회의(UNFSS)','세계식량정상회의','영양을 위한 성장 정상회의','제2차 국제영양회의'],a:0,e:'UNFSS(2021)는 생산~소비 전체 식량체계 전환을 다뤘다. ICN2는 2014, 영양행동 10년은 2016~25다.'},
  {q:'"삼중 영양불량(triple burden of malnutrition)"에 포함되지 않는 것은?',o:['저영양(발육부진·소모증)','미량영양소 결핍(숨은 기아)','과체중·비만','식중독'],a:3,e:'저영양·미량영양소 결핍·과체중이 한 국가, 심지어 한 가구 안에서 공존하는 현상이다.'},
  {q:'참여적 농촌평가(PRA) 방법론을 체계화한 학자는?',o:['로버트 챔버스','노먼 볼로그','아마르티아 센','제프리 삭스'],a:0,e:'챔버스는 외부 전문가 대신 주민이 직접 지도·순위매기기 등으로 현황을 분석하는 PRA를 발전시켰다(『농촌개발: 최후의 사람을 먼저』).'},
  {q:'관개 농지에 관한 설명으로 옳은 것은?',o:['세계 경작지의 약 20%이지만 식량의 약 40% 생산','경작지의 80%, 식량의 20%','전부 아프리카에 집중','수확량과 무관'],a:0,e:'관개는 생산성의 핵심이라 한국농어촌공사 등의 관개 ODA가 활발하다. 다만 담수의 70%를 농업이 사용해 물 갈등도 크다.'},
  {q:'개도국 농업노동력 중 여성 비율은 약?',o:['10%','25%','43%','80%'],a:2,e:'FAO 추산 여성이 농업노동력의 약 43%지만 토지·금융·투입재 접근이 제한되어, 격차 해소 시 생산량 20~30% 증가가 가능하다고 본다.'},
 ],
 'p2-4':[
  {q:'OECD 『States of Fragility』가 2022년 추가한 취약성 차원은?',o:['군사적 차원','인적(human) 차원','기술적 차원','문화적 차원'],a:1,e:'경제·환경·정치·안보·사회 5차원에 2022년 인적 차원이 더해져 6차원이 됐다. 세계 극빈층 다수가 취약국에 산다.'},
  {q:'2005년 UN 세계정상회의에서 채택된, 집단학살 등으로부터 자국민을 보호하지 못하는 국가에 국제사회가 개입할 수 있다는 원칙은?',o:['주권 불간섭','보호책임(R2P)','인도적 개입권','집단안전보장'],a:1,e:'R2P는 예방·대응·재건 3축으로 2011 리비아 개입의 근거가 됐으나 남용 논란도 있다. 같은 해 평화구축위원회(PBC)·평화구축기금(PBF)이 설치됐다.'},
  {q:'난민의 법적 정의와 보호를 규정한 국제조약은?',o:['1948 세계인권선언','1951 난민협약·1967 의정서','1966 자유권규약','2018 난민 글로벌콤팩트'],a:1,e:'1951 협약은 유럽·1951년 이전 사건으로 한정됐으나 1967 의정서로 시간·지역 제한이 해제됐다. 2018 글로벌콤팩트는 법적 구속력 없는 책임분담 틀이다.'},
  {q:'2016 세계인도주의정상회의 Grand Bargain의 핵심 합의가 아닌 것은?',o:['현지 행위자 지원(현지화) 확대','현금 기반 지원 확대','다년도·비지정 재원 확대','군사 개입 확대'],a:3,e:'Grand Bargain은 공여국과 인도주의 기구 간 효율화 약속으로 현지화·현금지원·투명성·보고 간소화를 담았다.'},
  {q:'인도적 지원의 최소 기준을 정한 1997년 민간 주도 기준은?',o:['스피어(Sphere) 기준','제네바 협약','IASC 가이드라인','센다이 프레임워크'],a:0,e:'스피어 핸드북은 물·위생, 식량, 쉼터, 보건 등 분야별 최소 기준과 인도주의 헌장을 담은 NGO 자율 기준이다.'},
  {q:'세계은행 거버넌스지표(WGI)에 관한 설명으로 옳은 것은?',o:['카우프만 등이 개발, 6개 차원','UNDP 개발, 3개 차원','TI 개발, 부패만 측정','UNESCAP 개발, 8요소'],a:0,e:'WGI 6차원은 발언권·책임성, 정치안정·비폭력, 정부효과성, 규제의 질, 법치, 부패통제다. 8요소는 UNESCAP 굿거버넌스다.'},
  {q:'2003년 채택된 최초의 보편적 반부패 국제조약은?',o:['OECD 뇌물방지협약','UN 반부패협약(UNCAC)','미주 반부패협약','FATF 권고'],a:1,e:'UNCAC(2003 메리다)는 예방·범죄화·국제협력·자산회수를 다룬다. OECD 뇌물방지협약(1997)은 해외공무원 뇌물에 한정된다.'},
  {q:'국가가 기본 서비스를 제공할 수 있는 최소 세수 역량의 임계치로 흔히 인용되는 세수/GDP 비율은?',o:['5%','15%','30%','50%'],a:1,e:'IMF·세계은행은 세수/GDP 15%를 지속적 성장과 서비스 제공의 임계치로 본다. 국내재원 동원(DRM)이 AAAA 핵심 의제다.'},
  {q:'한국 중앙선거관리위원회가 주도해 2013년 인천에 설립한 세계 선거기관 협의체는?',o:['A-WEB','IDEA','IFES','OSCE/ODIHR'],a:0,e:'세계선거기관협의체(A-WEB)는 선거관리 역량 ODA의 거점이다. IDEA는 스웨덴 국제기구, IFES는 미국 NGO다.'},
  {q:'SDG 16.9의 내용은?',o:['부패 감소','출생등록을 포함한 모든 사람의 법적 신원 보장','정보 접근','폭력 감소'],a:1,e:'출생등록이 없으면 교육·보건·상속 등 모든 권리 접근이 막히므로 LNOB의 출발점으로 강조된다.'},
  {q:'분쟁 민감성 접근에서 메리 앤더슨이 제시한 분석 틀은?',o:['SWOT 분석','분단선(dividers)과 연결선(connectors)','논리모형','가치사슬'],a:1,e:'Do No Harm(1999)은 원조가 분쟁을 악화시키는 분단선과 평화를 잇는 연결선을 식별해 사업을 설계하도록 한다.'},
  {q:'2016년 UN 총회·안보리가 동시 채택한 평화 관련 개념은?',o:['지속적 평화(sustaining peace)','적극적 평화','보호책임','예방외교'],a:0,e:'지속적 평화는 분쟁 전후 모든 단계에서 평화를 유지·구축하는 포괄 개념으로 HDP 넥서스와 연결된다.'},
 ],
 'p2-5':[
  {q:'IPCC에 관한 설명으로 옳지 않은 것은?',o:['1988년 WMO·UNEP가 설립','2007년 노벨평화상 수상','2018년 1.5℃ 특별보고서 발표','UNFCCC 사무국 역할 수행'],a:3,e:'IPCC는 과학적 평가보고서(AR6 2021~23)를 내는 과학기구이고, UNFCCC 사무국은 본(독일)에 별도로 있다.'},
  {q:'UNFCCC의 핵심 원칙으로 선진국과 개도국의 책임 차등을 명시한 것은?',o:['오염자 부담 원칙','공동의 그러나 차별화된 책임(CBDR)','사전예방 원칙','주권 평등 원칙'],a:1,e:'CBDR은 역사적 배출 책임이 큰 선진국(부속서 I)이 먼저 감축하고 개도국을 지원하도록 한다. 파리협정은 이를 "각국 역량 고려(RC)"와 결합했다.'},
  {q:'교토의정서의 3대 유연성 메커니즘에 해당하지 않는 것은?',o:['청정개발체제(CDM)','배출권거래제(ET)','공동이행(JI)','손실과 피해 기금'],a:3,e:'CDM·ET·JI가 교토 메커니즘이다. CDM은 선진국이 개도국에서 감축사업을 하고 크레딧을 얻는 제도로 수익 2%가 적응기금 재원이다.'},
  {q:'지구환경기금(GEF)의 설립 연도는?',o:['1972','1991','2010','2015'],a:1,e:'GEF(1991)는 리우 3협약 등의 재정 메커니즘으로 세계은행이 수탁한다. GCF는 2010 합의·2013 송도 사무국이다.'},
  {q:'교토의정서가 규제한 온실가스 6종에 포함되지 않는 것은?',o:['이산화탄소(CO₂)','메탄(CH₄)','아산화질소(N₂O)','오존(O₃)'],a:3,e:'6종은 CO₂·CH₄·N₂O·HFCs·PFCs·SF₆다. 2012 도하 개정으로 NF₃가 추가됐다. 오존은 몬트리올의정서(1987) 대상 물질과 관련된다.'},
  {q:'2015년 채택된 재난위험경감 국제 프레임워크는?',o:['효고 행동강령','센다이 프레임워크(2015~2030)','파리협정','아디스아바바 행동의제'],a:1,e:'센다이 프레임워크는 효고 행동강령(2005~15)의 후속으로 4대 우선순위·7대 목표를 담았다. 2015년 3월 일본 센다이에서 채택됐다.'},
  {q:'한국이 주도해 2012년 국제기구로 전환시킨 녹색성장 연구기관은?',o:['GCF','GGGI(글로벌녹색성장연구소)','UNEP','IRENA'],a:1,e:'GGGI는 2010년 한국 재단으로 출범해 2012 리우+20에서 국제기구가 됐고 본부는 서울이다.'},
  {q:'2021년 서울에서 개최된 녹색성장·기후 관련 정상회의는?',o:['P4G 서울 정상회의','COP26','G20 정상회의','UNFSS'],a:0,e:'P4G(녹색성장과 글로벌 목표 2030을 위한 연대) 2차 정상회의가 2021년 5월 서울에서 열려 서울선언문을 채택했다.'},
  {q:'2021 글래스고 기후합의(COP26)의 특징적 문구는?',o:['석탄 발전의 단계적 감축(phase-down)','화석연료 즉시 금지','손실과 피해 기금 설립','NCQG 합의'],a:0,e:'인도·중국 요구로 "단계적 퇴출(phase-out)"이 "감축(phase-down)"으로 바뀌었다. L&D 기금은 COP27, NCQG는 COP29다.'},
  {q:'2024 바쿠 COP29에서 합의된 신규 기후재원 목표(NCQG)는?',o:['2030년까지 연 1,000억 달러','2035년까지 연 3,000억 달러','2050년까지 연 1조 달러','연 500억 달러'],a:1,e:'선진국 주도로 2035년까지 연 3,000억 달러를 조성하고 모든 재원을 합쳐 1.3조 달러를 지향한다는 내용이다. 개도국은 불충분하다고 반발했다.'},
  {q:'리우 3대 환경협약 중 1994년 채택된 것은?',o:['UNFCCC','CBD','UNCCD(사막화방지협약)','몬트리올의정서'],a:2,e:'UNFCCC·CBD는 1992 리우에서, UNCCD는 1994년 파리에서 채택됐다. DAC 리우 마커 4개가 이 협약들에 대응한다.'},
  {q:'파리협정의 적응 관련 국가 문서로 LDC가 작성하는 것은?',o:['NDC','NAPA / NAP(국가적응계획)','PRSP','VNR'],a:1,e:'NAPA(국가적응행동계획)는 LDC용, NAP(국가적응계획)는 2010 칸쿤에서 모든 당사국용으로 도입됐다. NDC는 감축 중심 기여다.'},
 ],
 'p2-6':[
  {q:'세계정보사회정상회의(WSIS)의 개최지·연도로 옳은 것은?',o:['2003 제네바·2005 튀니스','2000 뉴욕·2002 몬테레이','2012 리우·2015 아디스아바바','1992 리우·2002 요하네스버그'],a:0,e:'WSIS는 정보격차 해소를 다룬 첫 UN 정상회의로 WSIS+20 검토가 2025년에 이뤄졌다.'},
  {q:'2024년 UN 미래정상회의에서 채택된 디지털 거버넌스 문서는?',o:['글로벌 디지털 콤팩트(GDC)','튀니스 어젠다','의제21','AAAA'],a:0,e:'GDC는 디지털 격차 해소·AI 거버넌스·데이터 보호를 다루며 UN AI 과학패널 설치를 담았다.'},
  {q:'국가혁신체제(NIS) 이론을 정립한 학자들은?',o:['프리먼·룬드발','포터·크레이머','슘페터·케인스','로스토·루이스'],a:0,e:'크리스토퍼 프리먼과 벵트-오케 룬드발이 1980년대 후반 기업·대학·정부 간 상호작용으로 혁신을 설명했다.'},
  {q:'산업·대학·정부의 상호작용으로 혁신을 설명하는 모델은?',o:['삼중나선(Triple Helix)','가치사슬','PDM','SLA'],a:0,e:'에츠코위츠·레이더스도르프의 삼중나선 모델이다. 시민사회를 더해 사중나선(Quadruple Helix)으로 확장되기도 한다.'},
  {q:'"4차 산업혁명"을 2016년 다보스포럼 의제로 제시한 인물은?',o:['클라우스 슈밥','빌 게이츠','E.F. 슈마허','일론 머스크'],a:0,e:'세계경제포럼 회장 슈밥의 저서 『제4차 산업혁명』(2016)이 AI·IoT·빅데이터 융합 담론을 확산시켰다.'},
  {q:'"데이터 혁명(data revolution)"을 지속가능발전과 연결한 2014년 UN 보고서의 제목은?',o:['A World That Counts','The Future We Want','Our Common Future','Learning to Realize Education\'s Promise'],a:0,e:'UN 사무총장 독립전문가그룹 보고서 『A World That Counts』(2014)가 SDGs 모니터링을 위한 데이터 혁명을 촉구했다.'},
  {q:'사전에 합의한 성과가 달성되면 투자자에게 상환하는 성과기반 개발재원 수단은?',o:['개발임팩트본드(DIB)','예산지원','프로그램 차관','구속성 차관'],a:0,e:'DIB는 민간 투자자가 선투자하고 성과 검증 후 공여기관이 상환하는 혁신적 금융이다. 사회성과연계채권(SIB)의 개도국 버전이다.'},
  {q:'1966년 미국 원조로 설립되어 한국 과학기술 발전의 출발점이 된 기관은?',o:['KAIST','KIST','ETRI','KDI'],a:1,e:'KIST(한국과학기술연구소)는 1965년 한미 정상회담 합의로 1966년 설립됐다. KAIST는 1971년, KDI는 1971년이다.'},
  {q:'SDG 17.8의 내용은?',o:['LDC 기술은행 2017년까지 운영 개시','ODA 0.7%','부채 지속가능성','남남협력'],a:0,e:'17.6 기술 파트너십, 17.7 환경친화기술 이전, 17.8 LDC 기술은행·STI 역량구축 메커니즘 운영이다. 기술은행은 2016년 설립됐다.'},
  {q:'오픈소스 소프트웨어·공개 데이터·AI 모델처럼 누구나 재사용할 수 있는 디지털 자원을 뜻하는 용어는?',o:['디지털 공공재(DPG)','디지털 공공인프라(DPI)','적정기술','리빙랩'],a:0,e:'DPG는 2020년 UN 디지털협력 로드맵에서 정의됐고 DPG Alliance가 등록을 관리한다. DPI는 ID·결제·데이터교환 기반 시스템이다.'},
  {q:'제4차 기본계획에 따라 2026년 확정된 "AI 활용 개발협력 추진전략"의 목표 비전은?',o:['글로벌 AI 기본사회 실현','AI 수출 1위','AI 반도체 자립','디지털 뉴딜'],a:0,e:'협력국 AI 생태계 조성, 특화형 AI(현지 언어 데이터셋), AI 내재형 인프라를 단계적으로 지원한다는 내용이다.'},
 ],
 'p2-7':[
  {q:'『경제발전에서 여성의 역할』(1970)로 WID 접근의 토대를 놓은 학자는?',o:['에스터 보저럽','캐롤라인 모저','맥신 몰리뉴','아마르티아 센'],a:0,e:'보저럽은 개발이 여성의 지위를 오히려 악화시킨다고 분석해 여성을 개발에 통합하는 WID를 촉발했다.'},
  {q:'UN 여성의 해와 UN 여성 10년의 기간은?',o:['1975년, 1976~1985','1995년, 1996~2005','1946년, 1950~1960','2010년, 2011~2020'],a:0,e:'1975 멕시코 세계여성회의가 UN 여성의 해였고 1976~85가 UN 여성 10년이다. 1980 코펜하겐, 1985 나이로비 회의가 이어졌다.'},
  {q:'1995 베이징 행동강령의 "중대 관심분야" 수는?',o:['5개','8개','12개','17개'],a:2,e:'빈곤·교육·건강·폭력·무력분쟁·경제·권력·제도·인권·미디어·환경·여아 12개 분야다.'},
  {q:'성주류화를 "모든 정책·사업의 모든 단계에서 여성과 남성에 대한 함의를 평가하는 전략"으로 정의한 1997년 기구는?',o:['UN 총회','ECOSOC','OECD DAC','세계은행'],a:1,e:'1997년 ECOSOC 합의결론이 성주류화의 공식 정의다. 성평등을 최종 목표로 하는 "전략"이라는 점이 핵심이다.'},
  {q:'UNDP 성불평등지수(GII)의 3차원은?',o:['생식건강·역량강화(교육·의회)·노동시장 참여','소득·교육·보건','경제·교육·보건·정치','폭력·조혼·FGM'],a:0,e:'GII는 모성사망·청소년 출산(생식건강), 의회 의석·중등교육(역량), 노동참가율 3차원이다. 경제·교육·보건·정치 4부문은 WEF GGI다.'},
  {q:'정부 예산 편성·집행이 성별에 미치는 영향을 분석해 반영하는 제도는?',o:['성인지 예산','성별분리통계','젠더 마커','성주류화'],a:0,e:'한국은 2010년부터 국가재정법에 따라 성인지 예산서·결산서를 작성한다. 성별분리통계는 그 기초 자료다.'},
  {q:'SDG 5.3이 근절을 목표로 하는 유해 관행은?',o:['조혼·강제혼·여성성기절제(FGM)','무급 돌봄노동','성별 임금격차','여성 정치 참여 제한'],a:0,e:'5.2 폭력·인신매매, 5.3 조혼·FGM, 5.4 무급돌봄 인정, 5.5 리더십, 5.6 SRHR이다. 아동혼은 연 1,200만 건, FGM 피해자는 2억 명 이상이다.'},
  {q:'WHO 추산 일생 동안 신체적·성적 폭력을 경험하는 여성 비율은?',o:['10명 중 1명','5명 중 1명','3명 중 1명','2명 중 1명'],a:2,e:'약 3명 중 1명(30%)이 친밀한 파트너 또는 비파트너 폭력을 경험한다. 성기반폭력(GBV)은 SDG 5.2의 대상이다.'},
  {q:'여성이 수행하는 무급 돌봄·가사노동 시간은 남성의 약 몇 배로 추산되는가?',o:['같다','1.5배','3배','10배'],a:2,e:'ILO 추산 여성이 세계 무급돌봄의 76%를 담당해 남성의 약 3배다. SDG 5.4가 이를 인정·재분배하도록 한다.'},
  {q:'베이징+25를 계기로 2021년 멕시코시티·파리에서 열린 성평등 글로벌 회의는?',o:['세대평등포럼(Generation Equality Forum)','세계여성회의','CSW 65','ICPD+25'],a:0,e:'UN Women 주도 세대평등포럼은 6개 행동연합을 통해 2026년까지의 공약을 모았다. ICPD+25는 2019 나이로비다.'},
  {q:'성별·인종·계급·장애 등 여러 차별이 중첩되어 작동함을 분석하는 개념은?',o:['교차성(intersectionality)','성주류화','전략적 젠더 욕구','포용적 비즈니스'],a:0,e:'킴벌리 크렌쇼(1989)가 제시한 교차성은 LNOB 이행에서 가장 소외된 집단(장애 여성, 농촌 소수민족 여아 등)을 식별하는 틀이다.'},
 ],
 'p2-8':[
  {q:'세계인권선언(UDHR)의 채택 연도와 조문 수는?',o:['1945년, 51개조','1948년, 30개조','1966년, 53개조','1993년, 39개조'],a:1,e:'1948년 12월 10일(세계인권의 날) UN 총회에서 채택된 30개조 선언이다. 법적 구속력은 없으나 관습국제법으로 인정된다.'},
  {q:'UN 인권최고대표사무소(OHCHR)의 설립 연도와 계기는?',o:['1948, UDHR','1966, 국제인권규약','1993, 비엔나 세계인권회의','2006, 인권이사회'],a:2,e:'비엔나 선언·행동계획(1993)의 권고로 같은 해 12월 OHCHR이 설립됐다. 인권이사회(2006)는 인권위원회를 대체한 별도 기구다.'},
  {q:'"발전권"을 양도할 수 없는 인권으로 선언한 UN 문서와 연도는?',o:['발전권 선언, 1986','비엔나 선언, 1993','새천년선언, 2000','2030 의제, 2015'],a:0,e:'1986 UN 총회 발전권 선언(미국 반대)은 개발을 인권으로 규정해 HRBA의 토대가 됐다. 비엔나(1993)가 이를 재확인했다.'},
  {q:'아동권리협약(CRC)의 4대 일반원칙에 해당하지 않는 것은?',o:['비차별','아동 최선의 이익','생존과 발달','의무교육'],a:3,e:'4대 원칙은 비차별(2조)·아동 최선의 이익(3조)·생존과 발달(6조)·참여(12조)다. 교육권은 28~29조에 별도 규정된다.'},
  {q:'UN 인권이사회 보편적 정례검토(UPR)의 주기는?',o:['매년','약 4.5년','10년','비정기'],a:1,e:'UPR은 193개 전 회원국을 약 4.5년 주기로 검토하며 2017년부터 3주기가 시작됐다. 한국은 2008·2012·2017·2023년 검토를 받았다.'},
  {q:'9대 핵심 인권조약 중 가장 먼저 채택된 것은?',o:['자유권규약(1966)','인종차별철폐협약(ICERD, 1965)','여성차별철폐협약(1979)','고문방지협약(1984)'],a:1,e:'ICERD(1965)가 최초이고 ICCPR·ICESCR(1966), CEDAW(1979), CAT(1984), CRC(1989), ICMW(1990), CRPD·CPED(2006) 순이다.'},
  {q:'장애 통계를 국제 비교 가능하게 수집하기 위한 표준 질문 세트는?',o:['워싱턴그룹 질문(Washington Group Questions)','MPI 지표','DHS 설문','PISA'],a:0,e:'UN 통계위 산하 워싱턴그룹이 개발한 6개 기능 질문(보기·듣기·걷기·인지·자기관리·의사소통)으로 SDG 장애 분리통계에 쓰인다.'},
  {q:'ILO·UNICEF 2020년 추산 세계 아동노동 인구는 약?',o:['5천만 명','1.6억 명','5억 명','10억 명'],a:1,e:'20년 만에 처음 증가해 1.6억 명(아동 10명 중 1명)이며 SDG 8.7이 2025년까지 모든 형태 아동노동 종식을 목표로 했다.'},
  {q:'한국 국가인권위원회의 설립 연도는?',o:['1987','1993','2001','2006'],a:2,e:'국가인권위원회법에 따라 2001년 11월 독립기구로 출범했다. 파리원칙(1993)에 따른 국가인권기구(NHRI)다.'},
  {q:'제1차 글로벌 장애 정상회의(Global Disability Summit)의 개최지·연도는?',o:['런던 2018','오슬로 2022','뉴욕 2006','베를린 2025'],a:0,e:'1차 런던(2018, 영국·케냐·IDA 공동), 2차 오슬로(2022), 3차 베를린(2025)이다. 2006은 CRPD 채택이다.'},
  {q:'개발협력에 인권기반접근을 적용하기 위한 "UN 공동이해(Common Understanding)"가 채택된 연도는?',o:['1986','1993','2003','2015'],a:2,e:'2003년 UN 기구 간 합의로 모든 개발사업이 인권기준·원칙에 부합하고 의무담지자·권리보유자 역량을 키워야 한다고 규정했다.'},
  {q:'세계은행이 2018년 도입한 사업의 환경·사회 위험 관리 체계는?',o:['환경사회프레임워크(ESF)','PRSP','CAS','ESG 공시'],a:0,e:'ESF는 10개 환경사회기준(ESS)으로 구성되며 비자발적 이주·원주민·노동·이해관계자 참여를 다룬다. 종전 세이프가드 정책을 대체했다.'},
 ],
};
const EXTRA2={
 'p1-1':[
  {q:'민간자금흐름(PF)에 해당하는 것은?',o:['외국인직접투자(FDI)','공적수출신용','정부 무상원조','UN 분담금'],a:0,e:'PF는 FDI·은행대출·포트폴리오 투자 등 민간의 상업적 자금이다. 수출신용은 OOF, 무상원조는 ODA, UN 분담금은 다자 ODA다.'},
  {q:'상대빈곤의 일반적 정의는?',o:['하루 $2.15 미만 생활','사회 중위소득의 50% 미만','최저임금 미만 소득','식량 구매 불가 상태'],a:1,e:'상대빈곤은 그 사회 중위소득의 일정 비율(보통 50%, OECD 기준) 미만을 뜻한다. 절대빈곤은 국제빈곤선 기준 생존 최저 수준 미달이다.'},
  {q:'아마르티아 센의 『자유로서의 발전』(1999)이 제시한 발전관은?',o:['GDP 성장이 곧 발전','사람이 가치 있다고 여기는 삶을 선택할 실질적 자유(역량)의 확장','자본 축적 단계론','종속 탈피'],a:1,e:'센의 역량접근(capability approach)은 소득 대신 건강·교육·참여 등 실질적 자유를 발전의 척도로 삼아 HDI와 인간개발 패러다임의 이론적 토대가 됐다.'},
  {q:'농업 부문의 잉여노동이 근대 공업 부문으로 이동하며 성장한다는 1950년대 모형은?',o:['루이스 이중경제 모형','해로드-도마 모형','솔로 성장모형','프레비시-싱어 가설'],a:0,e:'아서 루이스(1954, 1979 노벨상)의 이중경제 모형은 근대화론의 대표 이론이다. 프레비시-싱어 가설은 1차 산품 교역조건 악화를 말하는 종속이론 계열이다.'},
  {q:'2023년 ODA/GNI 0.7% 목표를 달성한 DAC 회원국이 아닌 것은?',o:['노르웨이','스웨덴','독일','미국'],a:3,e:'2023년 달성국은 노르웨이(1.09%)·룩셈부르크·스웨덴·덴마크·독일(0.79%) 5개국이다. 미국은 절대액 1위지만 GNI 대비 0.24% 수준이다.'},
  {q:'2023년 기준 절대액 최대 ODA 공여국 순서로 옳은 것은?',o:['미국 > 독일 > 일본 > 영국 > 프랑스','독일 > 미국 > 영국 > 일본 > 프랑스','일본 > 미국 > 독일 > 프랑스 > 영국','영국 > 미국 > 독일 > 일본 > 프랑스'],a:0,e:'미국(약 660억 달러) > 독일 > 일본 > 영국 > 프랑스 순이다. 2025년 USAID 해체·유럽 공여국 감축으로 2025~26년 세계 ODA는 큰 폭 감소가 전망된다.'},
 ],
 'p1-2':[
  {q:'한국의 OECD 가입 연도는?',o:['1991','1996','2000','2010'],a:1,e:'1996년 29번째 회원국으로 OECD에 가입했고, 2000년 DAC 수원국 목록 제외, 2010년 DAC 가입으로 이어졌다.'},
  {q:'2000년 9월 새천년선언이 채택된 UN 새천년정상회의 참가국 수는?',o:['51개국','147개국 정상 포함 189개국','193개국','77개국'],a:1,e:'189개 회원국(정상 147명)이 채택한 새천년선언이 2001년 MDGs 8개 목표로 정리됐다. SDGs는 193개국이 채택했다.'},
  {q:'2005년 G8 글렌이글스 정상회의 결정으로 IMF·세계은행·AfDB의 채무를 전액 탕감한 이니셔티브는?',o:['HIPC','MDRI(다자채무경감 이니셔티브)','PRSP','브래디 플랜'],a:1,e:'MDRI는 HIPC 완료국의 다자채무 100% 탕감이다. 브래디 플랜(1989)은 중남미 상업은행 채무 재조정이다.'},
  {q:'2008 세계식량가격위기 이후 2009년 G8이 농업·식량안보 지원을 약속한 이니셔티브는?',o:['라퀼라 식량안보 이니셔티브','글렌이글스 합의','몬테레이 컨센서스','칸쿤 합의'],a:0,e:'라퀼라(이탈리아) G8은 3년간 200억 달러 농업 투자를 약속했다. 같은 해 코펜하겐 COP15가 열렸다.'},
  {q:'GPEDC 제2차 고위급회의(2016)가 열린 도시는?',o:['멕시코시티','나이로비','제네바','부산'],a:1,e:'1차 멕시코시티(2014), 2차 나이로비(2016), 3차 제네바 정상회의(2022)다. 나이로비 결과문서는 SDGs 시대 효과적 개발협력 원칙을 재확인했다.'},
  {q:'1980년대 개도국 "잃어버린 10년"의 직접적 배경이 아닌 것은?',o:['1·2차 오일쇼크','미국 고금리 정책','1982 멕시코 모라토리엄','SDGs 채택'],a:3,e:'오일쇼크·고금리·원자재가 하락이 외채위기로 이어졌고 IMF·세계은행 구조조정(SAP)과 워싱턴 컨센서스(1989)가 처방으로 등장했다.'},
 ],
 'p1-3':[
  {q:'SDG 6과 SDG 7의 주제로 옳은 것은?',o:['6 물·위생, 7 깨끗한 에너지','6 에너지, 7 물','6 도시, 7 해양','6 교육, 7 보건'],a:0,e:'SDG 6 깨끗한 물과 위생, SDG 7 모두를 위한 적정 가격의 깨끗한 에너지다. SDG 11 도시, 14 해양이다.'},
  {q:'SDG 8.7이 설정한 아동노동 종식 시한은?',o:['2020','2025','2030','2050'],a:1,e:'8.7은 2025년까지 모든 형태의 아동노동 종식, 강제노동·현대판 노예·인신매매 근절을 목표로 했다.'},
  {q:'SDG 12의 주제는?',o:['불평등 감소','책임 있는 소비와 생산','육상생태계','기후행동'],a:1,e:'12 책임 있는 소비·생산(식량 손실·폐기물·지속가능 공공조달), 10 불평등, 15 육상, 13 기후다.'},
  {q:'MDGs 8개 목표 중 유일하게 선진국(공여국)의 책임을 담은 목표는?',o:['MDG 1','MDG 7','MDG 8 개발을 위한 글로벌 파트너십','MDG 3'],a:2,e:'MDG 8은 ODA·무역·채무·기술 접근을 다뤘지만 수치 목표가 약해 MDGs의 비대칭성(개도국만 의무) 비판을 낳았고 SDGs 보편성으로 이어졌다.'},
  {q:'SDG 14와 15의 주제로 옳은 것은?',o:['14 해양생태계, 15 육상생태계','14 육상, 15 해양','14 도시, 15 에너지','14 기후, 15 물'],a:0,e:'14 해양(수중생명), 15 육상(산림·사막화·생물다양성)이다.'},
  {q:'HLPF 정례 회의가 열리는 시기는?',o:['매년 1월','매년 7월(ECOSOC 주관, 8일간)','매년 9월 총회 기간','2년마다'],a:1,e:'HLPF는 매년 7월 뉴욕에서 열리며 각국 VNR 발표가 이뤄진다. 9월 총회 기간에는 4년마다 SDG Summit이 열린다.'},
 ],
 'p1-4':[
  {q:'관례적으로 세계은행 총재와 IMF 총재를 배출하는 지역은?',o:['세계은행 미국 / IMF 유럽','세계은행 유럽 / IMF 미국','둘 다 미국','둘 다 개도국 순환'],a:0,e:'브레튼우즈 체제 이래 세계은행 총재는 미국, IMF 총재는 유럽 출신이 맡는 비공식 관행이 개도국 발언권 확대 요구와 함께 비판받는다.'},
  {q:'2019년 UN 개발체계 개편으로 상주조정관(RC) 체계가 소속을 옮긴 곳은?',o:['UNDP 소속 유지','UN 사무총장 직속(사무국)','세계은행','ECOSOC'],a:1,e:'RC는 종전 UNDP 상주대표 겸직에서 사무총장 직속 독립 체계로 바뀌어 국별 UN 협력체계(UNSDCF)를 총괄한다.'},
  {q:'2025년 미국 정부가 USAID를 대폭 축소·국무부로 통합한 조치의 영향으로 거론되는 것은?',o:['세계 ODA 사상 최대 증가','세계 ODA 총액의 큰 폭 감소와 보건·인도지원 공백','DAC 해체','UN 분담금 증가'],a:1,e:'미국은 최대 공여국(2023년 약 660억 달러)이어서 USAID 축소는 2025~26년 세계 ODA 감소의 핵심 요인으로 분석된다.'},
  {q:'2010년 G20 서울정상회의에서 채택된 개발 관련 합의는?',o:['서울 개발 컨센서스(공유 성장을 위한 서울 개발 컨센서스)','부산 파트너십','서울 선언 P4G','서울 교육포럼'],a:0,e:'한국은 G20 의장국으로 개발의제를 처음 G20 정식 의제로 올려 9개 핵심 분야 다년간 행동계획을 채택했다.'},
  {q:'KOICA의 포용적 비즈니스 지원 프로그램 명칭은?',o:['IBS(Inclusive Business Solution)','CTS','CIAT','KSP'],a:0,e:'IBS는 기업의 BoP 시장 비즈니스 모델에 KOICA가 공동 투자하는 민관협력 프로그램이다. CTS는 스타트업 혁신기술, CIAT는 연수, KSP는 기재부 정책자문이다.'},
  {q:'이스탄불 CSO 개발효과성 원칙(2010)에 포함되는 것은?',o:['인권과 사회정의 존중','수원국 조달 의무','공여국 이익 우선','군사 협력 확대'],a:0,e:'8원칙은 인권·사회정의, 성평등, 사람의 역량강화·민주적 주인의식·참여, 환경 지속가능성, 투명성·책무성, 공평한 파트너십·연대, 지식 창출·공유, 긍정적 변화 추구다.'},
 ],
 'p1-5':[
  {q:'제3차 기본계획이 제시한 2030년 ODA 규모 목표는?',o:['2019년 대비 2배(약 6.4조원)','GNI 0.7%','10조원','DAC 평균 수준'],a:0,e:'3차 계획은 2030년까지 ODA를 2019년 대비 2배로 늘린다고 했으나, 2026년 예산은 5.4조로 조정됐다. DAC는 한국에 GNI 0.3% 중기 목표를 권고한다.'},
  {q:'KOICA 본부 소재지는?',o:['서울 종로구','경기 성남시(분당)','세종특별자치시','인천 송도'],a:1,e:'KOICA 본부는 성남시 수정구에 있고 ODA교육원(연수센터)은 경기 성남에 함께 있다. 인천 송도는 GCF 사무국이다.'},
  {q:'2004년 시작된 기획재정부·KDI의 한국 경제발전경험 공유 정책자문 사업은?',o:['KSP(Knowledge Sharing Program)','KOPIA','CIAT','WFK'],a:0,e:'KSP는 협력국 정부에 한국의 정책 경험을 자문하는 지식공유 ODA로 기재부가 주관하고 KDI·수출입은행이 시행한다.'},
  {q:'3차 기본계획 중점협력국 27개국 중 아시아 국가 수는?',o:['7개','12개','4개','20개'],a:1,e:'아시아 12·아프리카 7·중남미 4·중동/CIS 4다. 아시아 집중은 한국 ODA의 지역적 특징이다.'},
  {q:'2026년 종합시행계획상 지원 협력국 수와 최대 비중 지역은?',o:['89개국, 아시아 30.4%','27개국, 아프리카 50%','150개국, 중남미 40%','50개국, 유럽 30%'],a:0,e:'89개국 중 아시아 30.4%·아프리카 24%, 분야는 교통 28.2%·인도적 지원 9.5%·교육 8.1%·보건 7.9%다.'},
  {q:'2024년 OECD DAC 제3차 한국 동료검토에서 반복 지적된 과제가 아닌 것은?',o:['시행기관 분절화','비구속화율 제고','젠더·장애 마커 비율 확대','ODA 규모가 지나치게 큼'],a:3,e:'DAC는 한국 ODA의 양적 성장을 평가하면서도 분절화·비구속화·범분야 이슈(젠더·환경) 주류화·GNI 대비 비율(0.3% 목표)을 과제로 지적했다.'},
 ],
 'p2-1':[
  {q:'SDG 4.6의 내용은?',o:['모든 청소년과 상당수 성인의 문해·수리력 달성','고등교육 평등 접근','교사 확충','장학금 확대'],a:0,e:'4.6 문해·수리, 4.3 고등·직업교육, 4.c 교사, 4.b 장학금이다. 세계 성인 비문해 인구는 약 7.6억 명으로 2/3가 여성이다.'},
  {q:'GPE의 전신으로 2002년 세계은행 주도로 출범한 이니셔티브는?',o:['EFA 패스트트랙 이니셔티브(FTI)','ECW','Education 2030','GEM'],a:0,e:'FTI(2002)가 2011년 글로벌교육파트너십(GPE)으로 개편됐다. 공여국·개도국·시민사회·민간이 참여하는 다자 기금이다.'},
  {q:'UNESCO의 설립 연도와 본부는?',o:['1945, 파리','1948, 제네바','1965, 뉴욕','1946, 로마'],a:0,e:'UNESCO는 1945년 런던 회의로 설립되어 파리에 본부를 둔다. 교육·과학·문화 전문기구이며 세계유산·GEM 보고서를 관장한다.'},
  {q:'장애아동의 교육권과 통합교육(포용교육)을 규정한 CRPD 조항은?',o:['제24조','제32조','제9조','제12조'],a:0,e:'CRPD 24조는 모든 수준에서 포용적 교육체계를 보장하도록 한다. 32조는 국제협력, 9조는 접근성, 12조는 법 앞의 평등이다.'},
  {q:'디지털 기술을 교육에 적용한 산업·사업 영역을 일컫는 말은?',o:['에드테크(EdTech)','핀테크','애그테크','헬스테크'],a:0,e:'코로나19 이후 원격교육 수요로 에드테크 ODA(이러닝·디지털 교과서·LMS)가 확대됐으나 기기·연결성 격차가 과제다.'},
  {q:'교육 ODA에서 "교육 접근(access)에서 질(quality)로"의 전환을 상징하는 두 목표 체계는?',o:['MDG 2(취학) → SDG 4(학습 성과)','EFA → MDG','IDGs → MDGs','SDG 4 → SDG 8'],a:0,e:'MDG 2는 초등 취학률만 다뤘고, SDG 4는 학습 성과·평생학습·형평성으로 범위를 넓혔다.'},
 ],
 'p2-2':[
  {q:'WHO 설립 연도·본부·세계보건의 날은?',o:['1948, 제네바, 4월 7일','1945, 뉴욕, 12월 12일','1978, 알마아타, 9월 12일','1946, 파리, 5월 5일'],a:0,e:'WHO 헌장 발효일(1948.4.7)이 세계보건의 날이다. 12월 12일은 UHC의 날이다.'},
  {q:'MDGs 8개 목표 중 보건 관련 3개 목표는?',o:['MDG 4·5·6','MDG 1·2·3','MDG 6·7·8','MDG 2·4·7'],a:0,e:'MDG 4 아동사망, 5 모성보건, 6 HIV/AIDS·말라리아 등 질병이다. SDGs에서는 SDG 3 하나로 통합되어 UHC·NCD가 추가됐다.'},
  {q:'백신연합 Gavi의 출범 연도와 주요 설립 주체는?',o:['2000, 게이츠재단 등','2002, G8','1974, WHO','2017, 노르웨이'],a:0,e:'Gavi는 2000년 다보스포럼에서 게이츠재단 7.5억 달러 기여로 출범해 저소득국 백신 접종을 지원한다.'},
  {q:'2020년 기준 세계 모성사망 수와 저·중소득국 비중은?',o:['약 28.7만 명, 95%','약 100만 명, 50%','약 5만 명, 80%','약 50만 명, 30%'],a:0,e:'연 약 28.7만 명이 임신·출산 관련으로 사망하며 거의 전부(95%)가 저·중소득국, 특히 사하라 이남·남아시아에서 발생한다.'},
  {q:'KOFIH가 운영하는 개도국 보건의료 인력 연수 프로그램은?',o:['이종욱 펠로우십','WFK','CIAT','KSP'],a:0,e:'이종욱 펠로우십(2007~)은 고 이종욱 WHO 사무총장을 기려 개도국 의료진을 한국에서 연수시키는 KOFIH 대표 사업이다.'},
  {q:'SDG 3.3이 2030년까지 종식 대상으로 명시한 질병이 아닌 것은?',o:['AIDS','결핵','말라리아','당뇨병'],a:3,e:'3.3은 AIDS·결핵·말라리아·소외열대질환 유행 종식과 간염·수인성 질병 대응이다. 당뇨는 3.4 비감염성질환에 속한다.'},
 ],
 'p2-3':[
  {q:'세계 식량안보·영양 현황(SOFI) 보고서를 공동 발간하는 5개 기구는?',o:['FAO·IFAD·UNICEF·WFP·WHO','세계은행·IMF·WTO·OECD·UNDP','FAO·CGIAR·GEF·UNEP·UNDP','WFP·UNHCR·OCHA·IOM·UNICEF'],a:0,e:'SOFI는 로마 3대 기구에 UNICEF·WHO가 더해 매년 발간한다. 2023년판 기준 기아 인구 약 7.35억 명이다.'},
  {q:'녹색혁명에 대한 비판으로 적절하지 않은 것은?',o:['화학비료·농약 과다 사용으로 환경 악화','관개·투입재 접근 가능한 대농에 혜택 집중','종자 다양성 감소','아시아 쌀 생산량 감소'],a:3,e:'녹색혁명은 아시아 곡물 생산을 크게 늘려 기근을 막았지만 환경 부담·불평등·단일 품종 의존 문제를 낳았다. 아프리카에는 효과가 제한적이었다.'},
  {q:'1970년대 한국 쌀 자급을 가능하게 한 다수확 품종은?',o:['통일벼','고시히카리','IR8','추청벼'],a:0,e:'통일벼는 IRRI와 협력해 개발(1971)한 다수확 품종으로 1977년 쌀 자급 달성에 기여했다. 한국 농업 ODA 개발경험의 대표 사례다.'},
  {q:'최근 식량위기의 원인으로 묶이는 "3C"는?',o:['분쟁(Conflict)·기후(Climate)·코로나(COVID-19)','자본·신용·통화','소비·비용·경쟁','옥수수·면화·커피'],a:0,e:'SOFI 보고서는 분쟁·기후변동·경기침체(코로나)를 3대 동인으로 보고, 2022년 이후 우크라이나 전쟁으로 비용(Cost) 요인이 더해졌다.'},
  {q:'국제미작연구소(IRRI)의 소재지는?',o:['필리핀 로스바뇨스','멕시코','인도','나이지리아'],a:0,e:'IRRI(1960)는 CGIAR 15개 센터 중 하나로 필리핀에 있다. CIMMYT(밀·옥수수)는 멕시코, IITA는 나이지리아, ICRISAT는 인도다.'},
  {q:'2008년 세계식량가격위기에 관한 설명으로 옳은 것은?',o:['곡물가 급등으로 30여 개국에서 식량 폭동 발생, 농업 투자 재조명','식량 가격 급락','녹색혁명 시작','FAO 설립 계기'],a:0,e:'바이오연료 수요·유가·투기·수출제한이 겹쳐 곡물가가 급등했고, 1980년대 이후 소홀했던 농업 ODA가 다시 강조되는 계기가 됐다(라퀼라 2009).'},
 ],
 'p2-4':[
  {q:'취약·분쟁국 그룹 g7+가 결성된 연도와 장소는?',o:['2010, 딜리(동티모르)','2005, 뉴욕','2011, 부산','2016, 이스탄불'],a:0,e:'g7+는 2010년 동티모르 딜리에서 취약국 스스로 결성해 2011 부산 뉴딜을 주도했다. 공여국과의 대화체는 IDPS다.'},

  app.querySelectorAll('[data-seq]').forEach(b=>b.onclick=()=>{const s=+b.dataset.seq;const set=PARTS.filter(p=>p.subj===s).flatMap(p=>shuffle(p.qs.map(q=>({...q,part:p.name,pid:p.id,subj:p.subj}))));start(set,'practice',`과목${s} 영역순 전체`)});
  app.querySelectorAll('[data-wrongview]').forEach(b=>b.onclick=()=>wrongView(+b.dataset.wrongview));
  app.querySelector('#all').onclick=()=>start(shuffle(allQs()),'practice','전체 문제');
  app.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{const p=PARTS.find(x=>x.id===b.dataset.part);start(shuffle(p.qs.map(q=>({...q,part:p.name,pid:p.id,subj:p.subj}))),'practice',p.name)});
  app.querySelector('#exam').onclick=()=>{const a=allQs();const s1=pick(a.filter(q=>q.subj===1),40),s2=pick(a.filter(q=>q.subj===2),40);start([...shuffle(s1),...shuffle(s2)],'exam','모의고사')};
  app.querySelector('#rand').onclick=()=>{start(pick(allQs(),20),'practice','랜덤 20문항')};
  app.querySelector('#wrong').onclick=()=>{const a=allQs();const set=wrongBank.map(k=>a.find(q=>q.q===k)).filter(Boolean);if(set.length)start(shuffle(set),'practice','오답노트')};
}

// ===== 퀴즈 =====
// 보기 순서 섞기 (정답 위치 암기 방지)
function remix(q){const idx=shuffle([0,1,2,3]);return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}}
// 덜 본 문제 우선 선택
let seen={};try{seen=JSON.parse(localStorage.getItem('oda-seen')||'{}')}catch(e){}
const pick=(arr,n)=>shuffle(arr).sort((a,b)=>(seen[a.q]||0)-(seen[b.q]||0)).slice(0,n);
function start(set,mode,title){
  set=set.map(remix);
  state={view:'quiz',set,i:0,answers:new Array(set.length).fill(null),mode,title,timer:null,endAt:null};
  if(mode==='exam'){state.endAt=Date.now()+100*60*1000;state.timer=setInterval(tick,1000)}
  render();
}
function tick(){const el=document.getElementById('timer');if(!el)return;const left=Math.max(0,state.endAt-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',left<10*60*1000);if(left<=0){clearInterval(state.timer);finish()}}
function render(){
  const q=state.set[state.i],n=state.set.length,ans=state.answers[state.i];
  const done=state.answers.filter(a=>a!==null).length;
  const timer=state.mode==='exam'?`<span class="timer" id="timer">100:00</span>`:'';
  app.innerHTML=`
  <div class="card">
   <div class="qbar"><span>${esc(state.title)} · ${done}/${n} 응답</span>${timer}<button class="ghost" id="quit" style="padding:4px 10px;font-size:.82rem">그만두기</button></div>
   <div class="progress" style="margin:10px 0 16px"><i style="width:${(state.i)/n*100}%"></i></div>
   <span class="tag">과목${q.subj} · ${esc(q.part)}</span>
   <div class="qnum">${String(state.i+1).padStart(2,'0')}<span style="font-size:.9rem;color:var(--muted)"> / ${n}</span></div>
   <div class="qtext">${esc(q.q)}</div>
   <div class="opts">${q.o.map((o,k)=>`<button class="opt ${ans!==null?(k===q.a?'correct':k===ans?'wrong':''):''}" data-k="${k}" ${ans!==null?'disabled':''}><span class="n">${'①②③④'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
   <div id="exp">${ans!==null?expHtml(q,ans):''}</div>
   <div class="nav"><button id="prev" ${state.i===0?'disabled':''}>이전</button>
    <div style="display:flex;gap:8px">${state.mode==='exam'&&ans!==null?`<button id="finish" class="ghost">제출하기</button>`:''}
    <button id="next" class="primary" ${ans===null?'disabled':''}>${state.i===n-1?'결과 보기':'다음'}</button></div></div>
  </div>`;
  if(state.mode==='exam')tick();
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  app.querySelector('#prev').onclick=()=>{state.i--;render()};
  app.querySelector('#next').onclick=()=>{if(state.i===n-1)finish();else{state.i++;render()}};
  app.querySelector('#quit').onclick=home;
  const f=app.querySelector('#finish');if(f)f.onclick=finish;
}
function expHtml(q,ans){const ok=ans===q.a;return `<div class="exp ${ok?'good':'bad'}">${IMG(ok?'good':'wrong')}<div><b>${ok?'정답입니다.':`오답. 정답은 ${'①②③④'[q.a]}번입니다.`}</b>${esc(q.e)}</div></div>`}
function answer(k){
  if(state.answers[state.i]!==null)return;
  const q=state.set[state.i];state.answers[state.i]=k;
  seen[q.q]=(seen[q.q]||0)+1;try{localStorage.setItem('oda-seen',JSON.stringify(seen))}catch(e){}
  if(k!==q.a){if(!wrongBank.includes(q.q))wrongBank.push(q.q)}else if(state.title==='오답노트'){wrongBank=wrongBank.filter(x=>x!==q.q)}
  save();render();
  const next=document.getElementById('next');if(next)next.focus();
}

// ===== 오답노트 보기 =====
function wrongView(subj){
  clearInterval(state.timer);
  const a=allQs();
  const parts=PARTS.filter(p=>p.subj===subj);
  const groups=parts.map(p=>({p,qs:p.qs.filter(q=>wrongBank.includes(q.q))})).filter(g=>g.qs.length);
  const total=groups.reduce((s,g)=>s+g.qs.length,0);
  app.innerHTML=`
  <div class="card top hero"><div><div class="eyebrow">오답노트</div><h2 style="font-size:1.15rem">과목${subj} 틀린 문항 ${total}개</h2>
   <p style="color:var(--muted);font-size:.9rem;margin:6px 0 0">${total?'영역순으로 정리했습니다. 정답과 해설을 읽고, 다시 풀어 맞히면 노트에서 빠집니다.':'아직 틀린 문항이 없습니다. 문제를 풀면 여기에 쌓입니다.'}</p>
   <div class="nav"><button id="home">홈으로</button><button class="primary" id="solve" ${total?'':'disabled'}>이 ${total}문항 다시 풀기</button></div></div>${IMG(total?'board':'think')}</div>
  ${groups.map(g=>`<div class="card review"><h3 style="font-size:1rem">${esc(g.p.name)} <small style="font-family:var(--body);font-weight:400;color:var(--muted)">${g.qs.length}문항</small></h3>
   ${g.qs.map(q=>`<div class="item"><div class="q">${esc(q.q)}</div><div class="a">${IMG('idea')}<div>정답 <b>${esc(q.o[q.a])}</b><br>${esc(q.e)}</div></div></div>`).join('')}</div>`).join('')}`;
  app.querySelector('#home').onclick=home;
  app.querySelector('#solve').onclick=()=>start(shuffle(groups.flatMap(g=>g.qs.map(q=>({...q,part:g.p.name,pid:g.p.id,subj:g.p.subj})))),'practice','오답노트');
  window.scrollTo(0,0);
}

// ===== 결과 =====
function finish(){
  clearInterval(state.timer);
  const set=state.set,ans=state.answers;
  const correct=set.filter((q,i)=>ans[i]===q.a).length,n=set.length,pct=Math.round(correct/n*100);
  history.push({t:Date.now(),title:state.title,pct,n});save();
  const byPart={};set.forEach((q,i)=>{const b=byPart[q.part]||(byPart[q.part]={c:0,n:0,subj:q.subj});b.n++;if(ans[i]===q.a)b.c++});
  let verdict='';
  if(state.mode==='exam'){
    const s1=set.filter(q=>q.subj===1),s2=set.filter(q=>q.subj===2);
    const sc=s=>{const c=s.filter(q=>ans[set.indexOf(q)]===q.a).length;return Math.round(c/s.length*100)};
    const p1=sc(s1),p2=sc(s2),avg=Math.round((p1+p2)/2),pass=p1>=60&&p2>=60&&avg>=70;
    verdict=`<div style="margin-top:10px">과목1 <b>${p1}점</b> · 과목2 <b>${p2}점</b> · 평균 <b>${avg}점</b> → <span class="pass ${pass?'ok':'no'}">${pass?'합격권':'불합격권'}</span><div style="color:var(--muted);font-size:.85rem">합격 기준: 과목당 60점 이상, 평균 70점 이상</div></div>`;
  }
  const rows=Object.entries(byPart).map(([k,v])=>`<tr><td>과목${v.subj} · ${esc(k)}</td><td class="r">${v.c}/${v.n}</td><td><div class="bar"><i style="width:${v.c/v.n*100}%"></i></div></td></tr>`).join('');
  const wrongs=set.map((q,i)=>({q,i})).filter(x=>ans[x.i]!==x.q.a);
  app.innerHTML=`
  <div class="card top hero"><div><div class="eyebrow">${esc(state.title)} 결과</div>
   <div class="score"><span class="big">${pct}<span style="font-size:1.2rem">%</span></span><span>${correct} / ${n} 정답 ${ans.filter(a=>a===null).length?`· 미응답 ${ans.filter(a=>a===null).length}`:''}</span></div>${verdict}</div>${IMG(pct>=70?'good':pct>=50?'think':'wrong')}</div>
  <div class="card"><table><thead><tr><th>파트</th><th class="r">정답</th><th style="width:30%"></th></tr></thead><tbody>${rows}</tbody></table>
   <div class="nav"><button id="home">홈으로</button><div style="display:flex;gap:8px">${wrongs.length?`<button id="retry">틀린 ${wrongs.length}문항 다시 풀기</button>`:''}<button class="primary" id="again">같은 세트 다시</button></div></div></div>
  ${wrongs.length?`<div class="card review"><h2 style="font-size:1.05rem">오답 복습</h2>${wrongs.map(({q,i})=>`<div class="item"><div class="q">${i+1}. ${esc(q.q)}</div><div class="a">${IMG('idea')}<div>정답 <b>${'①②③④'[q.a]} ${esc(q.o[q.a])}</b>${ans[i]!==null?` · 내 답 ${'①②③④'[ans[i]]}`:' · 미응답'}<br>${esc(q.e)}</div></div></div>`).join('')}</div>`:''}`;
  app.querySelector('#home').onclick=home;
  app.querySelector('#again').onclick=()=>start(shuffle(set),state.mode,state.title);
  const r=app.querySelector('#retry');if(r)r.onclick=()=>start(shuffle(wrongs.map(x=>x.q)),'practice',state.title+' 오답');
  window.scrollTo(0,0);
}
home();
</script>

</body></html>
